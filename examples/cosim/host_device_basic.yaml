# Basic host-device co-simulation reference config.
#
# 1 host (in-order core, L1+L2 cache hierarchy, DDR5 main memory) + 1 PIM
# device (8 ALU PEs at BANK placement, its own NoC and memory technology --
# the SAME device model a standalone device simulation uses).
#
# Co-sim has no special workloads: ANY ordinary workload runs here. Its ROI
# region (the kernel) executes on the device; out-of-ROI code (setup, post-
# processing) executes on the host; boundary crossings are charged with the
# host-device link and memory technology models.
#
# Run with:
#   ./build/pimid --method exec --scope system \
#       --config examples/cosim/host_device_basic.yaml \
#       --workload benchmarks/pim_kernels/reduction/reduction_omp \
#       --workload-type openmp --size 4096
#
# Replace the workload with any pim_kernels binary (histogram, spmv_csr,
# stream_triad, gemv, bfs, stencil_2d, vector_add ...) -- same config.

scope: system

system:
  hosts:
    - name: host
      core_type: in_order_core
      num_cores: 1
      frequency_mhz: 2000    # host: logic process
      tech_node_nm: 22
      cache:
        l1d_kb: 32
        l1i_kb: 32
        l2_kb: 256
      memory:
        technology: DDR5

  devices:
    - name: device
      type: compute
      attachment: internal     # on-package; use links for pcie/interposer
      frequency_mhz: 500     # device: DRAM-periphery silicon. Was 2000 --
                             # the host clock copied down. No DRAM-periphery
                             # PE has run near that: FIMDRAM 300 MHz (ISSCC
                             # 2021 25.4), UPMEM DPU 350-466 MHz.
      tech_node_nm: 22
      pe_type: alu_core
      num_pes: 8
      pim:
        placement:
          level: BANK
        mc:
          type: simple
      memory:
        technology: DDR4
        banks: 16
      noc:
        model: detailed   # 1.11.106: the device fabric is the DRAM tree (a NAMED MESH_2D is the in-die fabric, analytical model only)

  network:
    topology: crossbar
    model: detailed
