# Host-only baseline: 1 OOO host core (co-sim 1.7 fig5 baseline cell).
#
# This is a system-scope config run under PIMID_COSIM_NO_OFFLOAD=1: the ROI/
# WORK magic ops become STAT-ONLY (no device migration, no transfer charged),
# so the unmodified OMP/MPI kernel runs on the host OOO core(s) end to end
# against the host memory technology. The device block below is REQUIRED by
# the system-scope parser ("a host must be accompanied by at least one memory
# device") but is INERT under the knob -- no thread ever migrates to it.
#
# The sweep runner overrides memory.technology per cell (host tech = device
# tech of the paired co-sim cell -- no host-tech confound). DDR5 is a
# placeholder default only.
#
# Run with:
#   PIMID_COSIM_NO_OFFLOAD=1 ./build/pimid --method exec --scope system \
#       --config examples/cosim/baseline_host_1core.yaml \
#       --workload benchmarks/pim_kernels/gemv/gemv_omp \
#       --workload-type openmp --size 512
#
# 1 core = no host fabric (a crossbar is degenerate at a single core); the
# core-to-memory path is the calibrated analytic memory latency.

scope: system

system:
  hosts:
    - name: host
      core_type: ooo_core
      num_cores: 1
      frequency_mhz: 2000
      tech_node_nm: 22
      cache:
        l1d_kb: 32
        l1i_kb: 32
        l2_kb: 256
      memory:
        technology: DDR5      # sweep runner overrides per cell

  devices:
    - name: device
      type: compute
      attachment: internal
      frequency_mhz: 2000
      tech_node_nm: 22
      pe_type: alu_core
      num_pes: 8            # inert under NO_OFFLOAD: OMP team / MPI ranks = host num_cores
      pim:
        placement:
          level: BANK
        mc:
          type: simple
      memory:
        technology: DDR5      # inert under NO_OFFLOAD; kept = host tech
        banks: 16
      noc:
        topology: MESH_2D
        model: detailed
