# Multi-device host-device co-simulation reference config.
#
# 1 host + 1 PIM device over a PCIe Gen5 system network, plus the second
# device kept below as a COMMENTED reference layout.
#
# This build prices one memory per role (1.11.45): the measured counters exist
# as a single host/device pair, so a second device node is refused at load.
# The second device is preserved below, commented, as the layout for a
# multi-device system.
#
# Run with:
#   ./build/pimid --method exec \
#       --config examples/cosim/multi_device.yaml \
#       --workload benchmarks/pim_kernels/reduction/reduction_omp \
#       1024 4 0

system:
  hosts:
    - name: host
      core_type: ooo_core
      num_cores: 1
      frequency_mhz: 2000
      tech_node_nm: 22
      cache:
        l1d_kb: 32
        l1i_kb: 32
        l2_kb: 256
      memory:
        technology: SRAM

  devices:
    - name: device0
      attachment: external   # 1.11.106: internal | external (the link class follows the attachment; name one with power.link.link_type)
      frequency_mhz: 2000
      tech_node_nm: 22
      pe_type: alu_core
      num_pes: 4
      pim:
        placement:
          level: BANK
        mc:
          type: simple
      memory:
        technology: SRAM
      noc:
        topology: MESH_2D
        model: analytical   # 1.11.106: simple was refused since 1.11.90

    # v2 scope -- refused by resolveMemoryTopology() in this build (see header):
    # - name: device1
    #   attachment: pcie_gen5
    #   frequency_mhz: 2000
    #   tech_node_nm: 22
    #   pe_type: alu_core
    #   num_pes: 4
    #   pim:
    #     placement:
    #       level: BANK
    #     mc:
    #       type: simple
    #   memory:
    #     technology: SRAM
    #   noc:
    #     topology: MESH_2D
    #     model: analytical   # 1.11.106

  network:
    topology: crossbar
    model: analytical   # 1.11.106
