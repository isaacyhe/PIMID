# Host-only baseline: 16 OOO host cores (the host baseline of the paper's
# co-simulation experiment).
#
# A co-simulation config run under PIMID_COSIM_NO_OFFLOAD=1: the ROI/WORK magic
# ops become statistics markers only (no device migration, no transfer charged),
# so the unmodified OMP/MPI kernel runs on the 16 host OOO cores end to end against
# the host memory technology. The device block below is required by the
# configuration but is inert under the knob -- no thread migrates to it.
#
# The experiment sets memory.technology per cell (host tech = device tech of
# the paired co-simulation cell -- no host-tech confound). DDR5 is a
# placeholder default only.
#
# Run with:
#   PIMID_COSIM_NO_OFFLOAD=1 ./build/pimid --method exec \
#       --config examples/cosim/baseline_host_16core.yaml \
#       --workload benchmarks/pim_kernels/gemv/gemv_omp --size 512 \
#       --workload-type openmp
#
# 16 cores: the host fabric is a crossbar (uniform one-hop; contention at
# ports, not hops).

system:
  hosts:
    - name: host
      core_type: ooo_core
      num_cores: 16
      frequency_mhz: 2000
      tech_node_nm: 22
      cache:
        l1d_kb: 32
        l1i_kb: 32
        l2_kb: 256
      memory:
        technology: DDR5      # set per cell by the experiment
                              # per-channel BW + channel count auto-derived from
                              # tech (DDR5 c=1 x 25.6 GB/s; HBM3 c=16 x 51.2)
      noc:                    # multi-core host: analytic crossbar fabric
        topology: crossbar
        model: analytical
        hop_cycles: 4         # core->LLC/MC one-hop (core clock); contention at
                              # the MC port is priced by the host-MC M/D/1

  devices:
    - name: device
      attachment: internal
      frequency_mhz: 2000
      tech_node_nm: 22
      pe_type: alu_core
      num_pes: 8            # inert under NO_OFFLOAD: OMP team / MPI ranks = host num_cores
      pim:
        placement:
          level: BANK
        mc:
          type: simple
      memory:
        technology: DDR5      # inert under NO_OFFLOAD; kept = host tech
        banks: 16
      noc:
        model: detailed   # 1.11.106: the device fabric is the DRAM tree (a NAMED MESH_2D is the in-die fabric, analytical model only)

  network:
    topology: crossbar
    model: detailed
