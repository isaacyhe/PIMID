# The scalar single-issue in-order PE (1.12.1, ticket #114): in_order_core
# with issue width 1 and no branch predictor (static not-taken). It replaces
# the retired simple_core.
scope: device
workload:
  binary: benchmarks/pim_kernels/stream_triad/stream_triad
  args: ["--size", "1024"]
pim:
  pe:
    type: in_order_core
    count: 4
    issue_width: 1
    branch_predictor: none
  placement:
    level: BANK
  mc:
    type: simple
memory:
  technology: DDR4
noc:
  topology: MESH_2D
  model: analytical
