workload:
  binary: benchmarks/rodinia/kmeans/kmeans
  args: ["--points", "1024", "--clusters", "8", "--dims", "16", "--iters", "20"]
  env:
    OMP_NUM_THREADS: "8"
simulation:
  max_instructions: 10000000

system:
  devices:
    - name: device
      pim:
        pe:
          type: alu_core
          count: 8
          frequency_mhz: 1000
          placement:
            level: BANK
        mc:
          type: simple
      memory:
        technology: SRAM
      noc:
        topology: MESH_2D
        model: analytical
