workload:
  binary: benchmarks/rodinia/hotspot/hotspot
  args: ["--rows", "512", "--cols", "512", "--iters", "100"]
  env:
    OMP_NUM_THREADS: "8"
simulation:
  max_instructions: 100000000

system:
  devices:
    - name: device
      pim:
        pe:
          type: alu_core
          count: 8
          frequency_mhz: 1000
          placement:
            level: BANK
        mc:
          type: simple
      memory:
        technology: SRAM
      noc:
        topology: MESH_2D
        model: analytical
