workload:
  binary: benchmarks/rodinia/srad/srad
  args: ["--rows", "256", "--cols", "256", "--iters", "10"]
  env:
    OMP_NUM_THREADS: "8"
simulation:
  max_instructions: 10000000

system:
  devices:
    - name: device
      pim:
        pe:
          type: alu_core
          count: 8
          frequency_mhz: 1000
          placement:
            level: BANK
        mc:
          type: simple
      memory:
        technology: SRAM
      noc:
        topology: MESH_2D
        model: analytical
