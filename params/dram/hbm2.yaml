# PIMID shipped part record -- HBM2
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; its source beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: HBM2
part: "20 nm HBM2 core die, 8 Gb user capacity, 12x8 mm (Sohn et al., ISSCC 2016 18.2 / JSSC 2017)"
vendor: "Samsung"
generation: "2x"            # vendor generation label of the DENSITY part
feature_nm: 20.0                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 10.666666666666666  # measured FULL-DIE density, user capacity basis (D11)
density_source: "Samsung 20 nm HBM2 core die: 8 Gb / 96 mm^2 = 0.0833 Gb/mm^2 (Sohn, ISSCC 2016 18.2; JSSC vol.52 no.1) x 128"
organization_preset: "HBM2_4Gb"   # Ramulator org preset the run instantiates (default knobs)
timing_preset: "HBM2_2.4Gbps"         # Ramulator timing preset (default knobs)
channels: 8                   # channels the preset instantiates per stack
channel_width_bits: 128   # 1.11.101 (step 2): JESD235D 2.x: eight 128-bit channels per stack, each two 64-bit pseudo-channels
# (1.12.276): the timing rules the DRAM replay applies to this part; the run's YAML overrides each
# (pim.mc.bank_parallel.channel_is_device, pim.mc.activation_window).
bank_parallel:
  channel_is_device: false   # JESD235D: the device timing (tRRD, tFAW, precharge-all, refresh) is held per pseudo-channel; the channel level holds the bus the pseudo-channels share, which the bank-parallel controller (BANK/BANK_GROUP placement) lifts
activation_window: enforce   # JESD235D tFAW: at most four ACTs in one tFAW window, per pseudo-channel (Ramulator2 nFAW); off lifts the window (a design that widens it)
host_interleave_bytes: 4096   # (1.12.282): a host page no element placed stays on one unit, page by page (1.12.146); a power of two from 64 to 2048 spreads it over the bank groups, then the banks; memory.controller.host_interleave_bytes overrides
stack_dies: 4                 # core dies per stack = max(JEDEC floor, channels/2) today (becomes the record's fact)
die_capacity_gb: 8.0           # = preset MB/channel x channels x 8 / dies (NOTE: the density part is a 16 Gb die; the user decides the record's part)
refresh_ladder:                    # HBM temperature-compensated refresh: 2x 85-95 C, 4x above 95 C (Xilinx PG276, Intel UG-20031; JESD235 refresh modes)
  - { above_c: 85.0, factor: 0.5 }
  - { above_c: 95.0, factor: 0.25 }

# (1.12.88): IDD vs temperature. Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 4 (36
# HBM2 chips, all-chip mean slopes of a linear fit of current vs temperature over each loop's warm-up, 48-86 C,
# Takeaway 3): IDD2N 6.41, IDD3N1 6.08 mA/C per chip; mean idle temperature during the IDD2N loop 54.2 C (the
# temperature this record's standby was measured at). Per channel: / 8. ONE standby slope, IDD2N's, for IDD2N and
# IDD3N (IDD3N1's 6.08 is within 5% of it): every loop then shifts by the same current and the activate, burst and
# refresh excesses stay as measured. IDD2P: x 28/40, the record's IDD2P/IDD2N rule.
idd_temperature:
  form: LINEAR_STANDBY
  reference_c: 54.2
  lo_c: 48.0
  hi_c: 86.0
  slope_idd2n: 0.80125
  slope_idd3n: 0.80125
  slope_idd2p: 0.560875
  source: "Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 4: IDD2N 6.41 mA/C per chip (IDD3N1 6.08), 48-86 C; idle 54.2 C; / 8 channels; one standby slope"

# ---- the part's measured data (1.11.104 step 1 transcribed it, cross-checked; 1.11.105 step 2: the only source) ----
idd:
  basis: "per channel"
  channels_basis: 8
  idd3n_bank_state: ONE_BANK
  vdd: 1.2
  idd0: 69.274138   # The precharged/active standby baseline at the preset (idd3n x 40/58 + idd2n x 18/58 = 61.123276) plus the activation excess IDD0 - (20 IDD3N1 + 9 IDD2N) / 29 of Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 3, (309.7 - 244.4931) / 8 = 8.150862 mA (the loop's tRAS 20 and tRC 29 cycles at 1.2 Gb/s; the preset keeps tRAS/tRC = 40/58): 1.2 V x 8.150862 mA x 48.3 ns = 472.6 pJ per activation, ONE 1 KB pseudo-channel activation per tRC (idd0_loop); was 69.504741 (excess 6.445 mA, 373.7 pJ, from the summary-file means)
  idd2n: 68.175000   # IDD2N, Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 3: 272.7 mA per stack / 8 channels = 34.0875 mA at 1.2 Gb/s, x2 to the record's 2.4 Gb/s preset (clocked standby linear in rate, voltage unchanged; docs/derivations/hbm_gddr6_idd.md sec. 1.10, 1.13); was 66.525
  idd3n: 57.950000   # IDD3N1 (one bank open), Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 3: 231.8 mA per stack / 8 = 28.975 mA at 1.2 Gb/s, x2 to the preset; was 61.5
  idd4r: 1467.030000   # IDD3N 57.95 + the array read part 1265.72 mA (the Table 3 read excess 1324.6 less the I/O the measured loop carried, taken as 0.23 pJ/b = 58.88 mA; docs/derivations/hbm_gddr6_idd.md sec. 1.13, 1.16) + the anchored DQ read I/O 143.36 mA (io_share below); was 1382.55
  idd4w: 1206.920000   # IDD3N 57.95 + the array write part 875.05 mA (the Table 3 write excess) + the anchored DQ write I/O 273.92 mA (io_share below; sec. 1.16); was 933.0
  idd5: 121.1875   # IDD2N 68.175 + the refresh loop excess (IDD5B - IDD2N) / 8 = (696.8 - 272.7) / 8 = 53.0125 mA (Table 3); the energy per REF takes trfc_ns below; was 119.9125
  # 1.12.18: refresh energy per REF = VDD x (IDD5 - IDD2N) x tRFC (+ VPP x (IPP5B - IPP2N) x tRFC where an IPP row exists): IDD2N baseline, the refresh interrupts the state
  idd2p: 47.7225   # IDD2N x 28/40, the IDD2P/IDD2N ratio of the HBM stack IDD table in N. Chatterjee et al., 'Architecting an Energy-Efficient DRAM System for GPUs', HPCA-23 2017, Table II (IDD2P 28, IDD2N 40 mA); was 46.5675
  trfc_ns: 350.0   # (1.12.50): ENERGY ONLY -- the refresh energy per REF = VDD x (IDD5 - IDD2N) x 350 ns, the measured part's all-bank tRFC as the authors publish it (github.com/CMU-SAFARI/HBM-Power config/HBM2_1200MTs/timing.json: nRFC 210 at tCK 1666.7 ps = 350 ns, "the JEDEC HBM2 all-bank refresh time for 8 Gb channels"). The timing is the preset's (HBM2_2.4Gbps; a record trfc_ns times DDR3 only, through trfc_bases), unchanged. Stated conflict: the artifact's program_idd5() source reads "int tRFC = 160;" (266.7 ns) beside a "tRFC=350ns = 210 cycles" comment (docs/derivations/hbm_gddr6_idd.md sec. 1.1); the rule takes 350 ns. Was 260.0
  trefi_ns: 3900.0
  source: "Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 3, All chips row (36 HBM2 chips; each chip's mean of the last 60 one-second samples of a 30-minute loop; the board's current with the HBM2 chip powered off subtracted): IDD2N 272.7, IDD3N1 231.8, IDD0 309.7, IDD4R 2881.0, IDD4W 1981.9, IDD5B 696.8 mA per stack at 1.2 Gb/s, VDD 1.2 V. The loops run on pseudo-channel 0 of each channel, so IDD0 is ONE 1 KB pseudo-channel activation per tRC (see idd0_loop) and a burst loop keeps one 64-bit pseudo-channel busy. Per channel = stack / 8. The row prices them at the preset 2.4 Gb/s: IDD2N and IDD3N x 2 (clocked standby linear in rate, voltage unchanged); the activation excess IDD0 - (20 IDD3N1 + 9 IDD2N) / 29, the read and write excesses over IDD3N1 x 4 (both pseudo-channels x 2.4/1.2 Gb/s) and the refresh excess over IDD2N ride on that baseline (docs/derivations/hbm_gddr6_idd.md sec. 1.10, 1.13)"
  idd0_loop: ONE_PC_PER_TRC   # 1.12.18: see hbm3.yaml; JESD235D Table 60 (pseudo channel mode) activates PC0 and PC1 each nRC
  vpp_act:   # 1.12.18: activation VPP = ratio x the VDD activate+precharge energy (vendor estimator ratio)
    ratio: 0.061825   # XPE 4G column (VU37P): C44/C33. Device match: this record is a 4-high stack (stack_dies 4), XPE's 4 GB stack column; the 8G column is printed beside it
    device: "XPE VU37P 4G stack column (HBM_Data!C44/C33 = 38.61/624.51 mW)"
    alt_ratio: 0.103041
    alt_device: "XPE VU47P 8G stack column (HBM_Data!D44/D33 = 77.22/749.412 mW)"
    source: "Xilinx Power Estimator (XPE) 2023.1.2, UltraScale+ workbook UltraScalePlus_XPE_2023_1_2.xlsm (vendor estimator), sheet HBM_Data: row 33 'VDD activate (read)' rail VCC_HBM 1.2 V and row 44 'VPP Activate' rail VCCAUX_HBM 2.5 V, column C '4G' (VU33P/VU35P/VU37P/VU57P) and column D '8G' (VU45P/VU47P), selector B = IF(part is VU45P/VU47P, D, C): C44/C33 = 38.61/624.51 = 0.061825, D44/D33 = 77.22/749.412 = 0.103041. An energy ratio (mW/mW at the same activity), so no voltage conversion is applied; XPE's own model scales each rail as (V/Vnom)^2, which a 1.1/1.8 V part would change by (1.8/2.5)^2/(1.1/1.2)^2 = 0.62 -- stated, not applied (the model prices the published ratio). The VDD part it multiplies is the measured SAFARI-based VDD ACT energy (unchanged). HBM2 VPP is 2.5 V (Sohn et al., JSSC 52(1) 2017: VPPE is the wordline driver supply; JESD235D); the SAFARI 'ipp' column is NOT a VPP measurement (card residual / 2.5 V; docs/derivations/hbm_gddr6_idd.md sec. 1.8), hence the ratio."
  vpp_standby:   # (1.12.142): standby VPP = ratio x the VDD standby power (vendor estimator ratio; same basis as vpp_act)
    ratio: 0.085615   # XPE 4G column (VU37P): C43/C37. Device match as vpp_act: this record is a 4-high stack
    device: "XPE VU37P 4G stack column (HBM_Data!C43/C37 = 8.2875/96.8 mW per Gb/s/pin)"
    alt_ratio: 0.100723
    alt_device: "XPE VU47P 8G stack column (HBM_Data!D43/D37 = 16.575/164.56 mW per Gb/s/pin)"
    source: "Xilinx Power Estimator (XPE) 2023.1.2, UltraScale+ workbook UltraScalePlus_XPE_2023_1_2.xlsm (vendor estimator), sheet HBM_Data: row 37 'idle VDD dynamic' rail VCC_HBM 1.2 V and row 43 'Idle VPP Dynamic' rail VCCAUX_HBM 2.5 V, column C '4G' (VU33P/VU35P/VU37P/VU57P) and column D '8G' (VU45P/VU47P), selector B = IF(part is VU45P/VU47P, D, C): C43/C37 = 8.2875/96.8 = 0.085615, D43/D37 = 16.575/164.56 = 0.100723. Both rows are per stack per Gb/s/pin and always on while the stack is clocked, so the ratio is independent of the data rate. An energy ratio (mW/mW at the same state), so no voltage conversion is applied, as for vpp_act; XPE's own model scales each rail as (V/Vnom)^2, which a 1.1/1.8 V part would change by (1.8/2.5)^2/(1.1/1.2)^2 = 0.62 -- stated, not applied. It multiplies the record's VDD standby (IDD2N/IDD3N on the VDD background's state split, at the run's temperature). XPE's VCCAUX_HBM leakage rows (Static_Data row 722) are not applied: the VDD standby the ratio multiplies is the measured current, leakage included. No refresh, burst or activate VPP term comes from this ratio (activation: vpp_act). The record has no HBM IPP2N/IPP3N row, hence the ratio."
  act_guard_nj_per_kb: { lo: 0.34, xpe_ceiling: 0.502, hi: 0.92, source: "lo 0.34: the IDD route through Chatterjee et al. HPCA-23 2017 Table II (VDD 1.2, IDD0 65, IDD3N 55, IDD2N 40 mA, tRC 47, tRAS 33 ns, 2 KB row: 816 pJ -> 408 pJ/KB at 1.2 V, 342-374 at 1.1 V); xpe_ceiling 0.50: XPE 2023.1.2 attribution ceiling (every access a miss, all VDD+VPP 'activate' power and the VDDQ miss term counted as ACT, VU47P 1.8 Gb/s, 64 B); hi 0.92: bottom-up model, O'Connor et al. MICRO-50 2017 Table 3 (909 pJ, 1 KB) / Chatterjee HPCA17 (112 fJ/bit = 0.92 nJ/KB). GUARD ONLY (printed by readEnergyGuardLines; never priced); ceiling 0.502: the XPE attribution ceiling 0.50 extended to include the activation of Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 3 (0.5018 nJ per 1 KB with this record's VPP ratio)" }
  io_share:   # the DQ I/O share INSIDE idd4r / idd4w, anchored on a published host-PHY energy of the same link (as hbm3.yaml)
    idd4r_ma: 143.36
    idd4w_ma: 273.92
    # The anchor (pJ/bit, read / write) and the channel rate the mA are computed at (anchor x channel_gbps / vdd). A
    # crossing access pays the array part plus this share; an access from a PE on the DRAM die pays the array part.
    anchor_read_pj_bit: 0.56
    anchor_write_pj_bit: 1.07
    channel_gbps: 307.2   # 128-bit channel (channel_width_bits) x 2.4 Gb/s (timing_preset HBM2_2.4Gbps)
    anchor_source: "Host-side HBM2E PHY energy, used UNSCALED as the DRAM-side figure, per direction: S. Hwang, K. Chae, T. Yeo et al. (Samsung Foundry), 'A 3.2 Gbps/pin HBM2E PHY with Low Power I/O and Enhanced Training Scheme for 2.5D System-in-Package Solutions', Hot Chips 32 (2020), poster slide 10 'Power and VWM measurement results': 0.56 pJ/bit read, 1.07 pJ/bit write (hard macro + I/O; 7 nm, 0.75/1.2 V, 3.2 Gb/s/pin)"
    source: "The method of the HBM3 record: the DQ I/O of an access that crosses the pins is priced at the published PHY energy of the same link, in the same direction (the host PHY at the other end moves the same bits over the same interposer DQ at the same rate). x 307.2 Gb/s / 1.2 V = 143.36 mA read, 273.92 mA write. The array part of the burst is kept as the measured row gives it (idd4r: the Table 3 read excess less the 58.88 mA the measured loop's own DQ I/O was taken as, 0.23 pJ/b; idd4w: the Table 3 write excess), so an access from a PE on the DRAM die pays exactly what it paid before; a crossing read pays the DQ I/O at 0.56 pJ/b instead of 0.23, a crossing write 1.07 pJ/b instead of none. Not voltage- or rate-scaled: the HBM2 I/O supply is the measured 1.2 V and a per-bit switching energy does not change with the rate (as the host PHY, src/power/cacti_io_wrapper.cpp). docs/derivations/hbm_gddr6_idd.md sec. 1.16"
  # stack_floor_mw: removed (1.12.46): NO per-stack floor. The 821.3 mA the floor came from is the board current with the HBM2 stack powered off, which the measurement subtracts as non-DRAM (Olgun et al., MICRO 2026 / arXiv:2610.14244 Sec. 4.3; github.com/CMU-SAFARI/HBM-Power config/HBM2_1200MTs/power.json and docs/explanation/idd-derivation.md: "board power-off current (821.3 mA)", "DRAM device only"). Was 469.98 mW per stack (783.3 mA x 1.2 V / 2). docs/derivations/hbm_gddr6_idd.md sec. 1.11
  background_guard_mw_stack: { lo: 855.0, hi: 1900.0, source: "XPE 2023.1.2 (UltraScale+) all DRAM rails idle per stack (HBM_Data B29, B31, B37, B43 + Static_Data rows 720-722 leakage), VU37P/VU47P columns, 1.2-1.8 Gb/s, 25 C typ .. 100 C max: 0.86-1.90 W. GUARD ONLY, never priced; lo 855: the XPE lower edge 860 extended to include the standby of Olgun et al., MICRO 2026; extended version arXiv:2610.14244, Appendix A, Table 3 (856.0 mW per stack at the 350 K default: active standby, refresh and standby VPP)" }
# (1.12.61): the data-dependent burst energy from the run's MEASURED DQ pin transitions between
# beats (1.12.58 counters), the authors' published relative model; the TSV and bank-group bus rates are not counted and
# stay at uniform random (0.5), the reference is uniform random on all three, so the record's IDD4R/IDD4W excess is the
# uniform-random value: E = E_record x pJ(dq, 0.5, 0.5) / pJ(0.5, 0.5, 0.5).
data_pattern:
  form: DQ_TOGGLE_RELATIVE
  floor_pj_bit: 3.1798
  c_dq: 1.04
  c_tsv: 1.4875
  c_bg: 1.41
  tsv_rate: 0.5        # not counted (the 2-bit TSV bus between beat i and i+2): uniform random
  bg_rate: 0.5         # not counted (burst-to-burst bank-group bus): uniform random
  ref_dq_rate: 0.5
  ref_tsv_rate: 0.5
  ref_bg_rate: 0.5
  apply_to_writes: true   # as the authors' configurations (datapattern.apply_to_writes); their fit is to reads
  source: "Olgun et al., MICRO 2026 (arXiv:2610.14244) Sec. 5.3 (DQ toggles 2 -> 64: read +32.0 %, write +82.0 %; bank-group bus toggling +29.4 %) and the authors' model, github.com/CMU-SAFARI/HBM-Power docs/explanation/data-pattern-model.md: pJ/bit = 3.1798 + 1.04 dq_rate + 1.4875 tsv_rate + 1.41 bg_rate (least squares over 32 beat patterns, R^2 about 0.87), relative form IDD4R_eff = IDD3N + (IDD4R - IDD3N) x pJ(knobs) / pJ(reference); config/HBM2_1200MTs/power.json (apply_to_writes true). The record's burst is the standard IDD4R loop (5.14 pJ/b measured) taken as uniform random (the measured random loop is 4.78, -7 %): stated. ACT: no data term (Sec. 5.2: no significant variation across rows; VAMPIRE Sec. 5.1)."

component_factors: none   # HBM rows are measured means; no typical/maximum factor applies
termination:   # DQ termination electricals; the formula (terminationNJ) stays in the tool
  scheme: none
  source: "HBM: unterminated single-ended interposer I/O; the anchored idd.io_share prices the DQ I/O (the band below is its guard)"
iddq_band_pj_bit: { lo: 0.30, hi: 1.07, source: "GUARD ONLY on this record (the DQ I/O of a crossing access is priced from idd.io_share): the published HBM2-class interposer DQ I/O and PHY energies per bit, reads and writes: lo 0.30, O'Connor et al., 'Fine-Grained DRAM', MICRO-50 2017, Fig. 1b (HBM2 I/O 0.3 pJ/bit); within: Chatterjee et al. HPCA-23 2017 (I/O 0.54 pJ/bit), O'Connor et al. Table 3 (I/O 0.80 pJ/bit at 50% activity), the HBM2E PHY read 0.56; hi 1.07, the HBM2E PHY write (S. Hwang, K. Chae, T. Yeo et al. (Samsung Foundry), 'A 3.2 Gbps/pin HBM2E PHY with Low Power I/O and Enhanced Training Scheme for 2.5D System-in-Package Solutions', Hot Chips 32 (2020), poster slide 10 'Power and VWM measurement results'). The earlier band, an HBM2 TSV-driver current (Cho et al., ISSCC 2018, 0.19-0.27), measures another link" }
# GUARD ONLY on this record since the DQ I/O share is anchored (io_share above); printed beside it as a check of the read and the write share.
