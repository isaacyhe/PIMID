# PIMID shipped part record -- HBM2
# 1.11.94: ONE record per part; every field required; provenance beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: HBM2
part: "20 nm HBM2 core die, 8 Gb user capacity, 12x8 mm (Sohn et al., ISSCC 2016 18.2 / JSSC 2017)"
vendor: "Samsung"
generation: "2x"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 20.0                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 10.666666666666666  # measured FULL-DIE density, user capacity basis (D11)
density_source: "Samsung 20 nm HBM2 core die: 8 Gb / 96 mm^2 = 0.0833 Gb/mm^2 (Sohn, ISSCC 2016 18.2; JSSC vol.52 no.1) x 128"
organization_preset: "HBM2_4Gb"   # Ramulator org preset the run instantiates (default knobs)
timing_preset: "HBM2_2.4Gbps"         # Ramulator timing preset (default knobs)
channels: 8                   # channels the preset instantiates per stack
channel_width_bits: 128   # 1.11.101 (step 2): JESD235D 2.x: eight 128-bit channels per stack, each two 64-bit pseudo-channels
stack_dies: 4                 # core dies per stack = max(JEDEC floor, channels/2) today (ruling 16: becomes the record's fact)
die_capacity_gb: 8.0           # = preset MB/channel x channels x 8 / dies (NOTE ruling 16: the density part is a 16 Gb die; the user decides the record's part)
refresh_ladder:                    # HBM temperature-compensated refresh: 2x 85-95 C, 4x above 95 C (Xilinx PG276, Intel UG-20031; JESD235 refresh modes)
  - { above_c: 85.0, factor: 0.5 }
  - { above_c: 95.0, factor: 0.25 }
