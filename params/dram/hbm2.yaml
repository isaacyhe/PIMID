    alt_ratio: 0.103041
    alt_device: "XPE VU47P 8G stack column (HBM_Data!D44/D33 = 77.22/749.412 mW)"
    provenance: DERIVED
    source: "Xilinx Power Estimator (XPE) 2023.1.2, UltraScale+ workbook UltraScalePlus_XPE_2023_1_2.xlsm (vendor estimator), sheet HBM_Data: row 33 'VDD activate (read)' rail VCC_HBM 1.2 V and row 44 'VPP Activate' rail VCCAUX_HBM 2.5 V, column C '4G' (VU33P/VU35P/VU37P/VU57P) and column D '8G' (VU45P/VU47P), selector B = IF(part is VU45P/VU47P, D, C): C44/C33 = 38.61/624.51 = 0.061825, D44/D33 = 77.22/749.412 = 0.103041. An energy ratio (mW/mW at the same activity), so no voltage conversion is applied; XPE's own model scales each rail as (V/Vnom)^2, which a 1.1/1.8 V part would change by (1.8/2.5)^2/(1.1/1.2)^2 = 0.62 -- stated, not applied (the ruling prices the published ratio). The VDD part it multiplies is the measured SAFARI-derived VDD ACT energy (unchanged). HBM2 VPP is 2.5 V (Sohn et al., JSSC 52(1) 2017: VPPE is the wordline driver supply; JESD235D); the SAFARI 'ipp' column is NOT a VPP measurement (card residual / 2.5 V; docs/derivations/hbm_gddr6_idd.md sec. 1.8), hence the ratio."
  act_guard_nj_per_kb: { lo: 0.34, xpe_ceiling: 0.50, hi: 0.92, source: "lo 0.34: the IDD route through Chatterjee et al. HPCA-23 2017 Table II (VDD 1.2, IDD0 65, IDD3N 55, IDD2N 40 mA, tRC 47, tRAS 33 ns, 2 KB row: 816 pJ -> 408 pJ/KB at 1.2 V, 342-374 at 1.1 V); xpe_ceiling 0.50: XPE 2023.1.2 attribution ceiling (every access a miss, all VDD+VPP 'activate' power and the VDDQ miss term counted as ACT, VU47P 1.8 Gb/s, 64 B); hi 0.92: bottom-up model, O'Connor et al. MICRO-50 2017 Table 3 (909 pJ, 1 KB) / Chatterjee HPCA17 (112 fJ/bit = 0.92 nJ/KB). GUARD ONLY (printed by readEnergyGuardLines; never priced)" }
  stack_floor_mw: 469.98   # 1.12.18 (user ruling 2026-10-24, floor option 2), DERIVED: the measured 783.3 mA x 1.2 V = 939.96 mW floor is the HBM_1V2 rail of TWO stacks; per stack = 939.96 / 2 = 469.98 mW (the even split is an assumption; XPE 2023.1.2 Static_Data rows 720/721 give equal DRAM leakage per stack). Evidence: SAFARI reads one current, HBM_1V2_I (artifact platform.cpp L48-54, L1443-1445); DS923: VCC_IO_HBM must be connected to VCC_HBM, so it is VDD + VDDQ of BOTH U55C stacks (+ the FPGA HBM PHY I/O); the IDD bitstreams drive one stack (DRAMBender README L9-13: chip0 = stack 0 / channels 0-7). The IDD columns above keep the measured per-channel increments of the driven stack (stack mean less the whole 783.3 mA, unchanged). docs/derivations/hbm_gddr6_idd.md sec. 1.9). Was 939.96 (1.11.91 item 12, ruling (c))
