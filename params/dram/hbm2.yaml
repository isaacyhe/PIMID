# PIMID shipped part record -- HBM2
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; provenance beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: HBM2
part: "20 nm HBM2 core die, 8 Gb user capacity, 12x8 mm (Sohn et al., ISSCC 2016 18.2 / JSSC 2017)"
vendor: "Samsung"
generation: "2x"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 20.0                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 10.666666666666666  # measured FULL-DIE density, user capacity basis (D11)
density_source: "Samsung 20 nm HBM2 core die: 8 Gb / 96 mm^2 = 0.0833 Gb/mm^2 (Sohn, ISSCC 2016 18.2; JSSC vol.52 no.1) x 128"
organization_preset: "HBM2_4Gb"   # Ramulator org preset the run instantiates (default knobs)
timing_preset: "HBM2_2.4Gbps"         # Ramulator timing preset (default knobs)
channels: 8                   # channels the preset instantiates per stack
channel_width_bits: 128   # 1.11.101 (step 2): JESD235D 2.x: eight 128-bit channels per stack, each two 64-bit pseudo-channels
stack_dies: 4                 # core dies per stack = max(JEDEC floor, channels/2) today (ruling 16: becomes the record's fact)
die_capacity_gb: 8.0           # = preset MB/channel x channels x 8 / dies (NOTE ruling 16: the density part is a 16 Gb die; the user decides the record's part)
refresh_ladder:                    # HBM temperature-compensated refresh: 2x 85-95 C, 4x above 95 C (Xilinx PG276, Intel UG-20031; JESD235 refresh modes)
  - { above_c: 85.0, factor: 0.5 }
  - { above_c: 95.0, factor: 0.25 }

# (1.12.88): IDD vs temperature. Olgun et al., MICRO 2026 (arXiv:2610.14244) Table 4 (36 HBM2 chips, all-chip mean
# slopes of a linear fit of current vs temperature over each loop's warm-up, 48-86 C, Takeaway 3): IDD2N 6.41,
# IDD3N1 6.08 mA/C per chip; mean idle temperature during the IDD2N loop 54.2 C (the temperature this record's
# standby was measured at). Per channel: / 8 (DERIVED). ONE standby slope, IDD2N's, for IDD2N and IDD3N (IDD3N1's
# 6.08 is within 5% of it): every loop then shifts by the same current and the activate, burst and refresh excesses
# stay as measured (the loops' own temperatures are not published). IDD2P: x 28/40, the record's IDD2P/IDD2N rule.
idd_temperature:
  form: LINEAR_STANDBY
  provenance: MEASURED
  reference_c: 54.2
  lo_c: 48.0
  hi_c: 86.0
  slope_idd2n: 0.80125
  slope_idd3n: 0.80125
  slope_idd2p: 0.560875
  source: "Olgun et al. MICRO 2026 (arXiv:2610.14244) Table 4: IDD2N 6.41 mA/C per chip (IDD3N1 6.08), 48-86 C; idle 54.2 C; / 8 channels; one standby slope"

# ---- the part's measured data (1.11.104 step 1 transcribed it, cross-checked; 1.11.105 step 2: the only source) ----
idd:
  basis: "per channel"
  channels_basis: 8
  provenance: DERIVED   # 1.12.18 (user ruling 2026-10-24, HBM2 rate): the measured SAFARI row with its clocked standby scaled to the preset rate; was MEASURED
  idd3n_bank_state: ONE_BANK
  vdd: 1.2
  idd0: 69.504741   # (1.12.46) (user ruling 2026-10-25, board offset): baseline -9.5 mA with IDD2N/IDD3N (activate energy unchanged: tRC = tRAS + tRP); was 79.004741. 1.12.18 (user ruling 2026-10-24, HBM2 rate): standby baseline shifted with IDD2N/IDD3N so the activate energy is unchanged (was 42.725); 1.12.18 (user ruling 2026-10-24, option 5): ONE 1 KB pseudo-channel activation per tRC (idd0_loop below), NOT the JESD235D Table 60 IDD0 (PC0 and PC1 every nRC)
  idd2n: 66.525000   # (1.12.46) (user ruling 2026-10-25, board offset): per-channel standby = (stack mean - 821.3 mA board power-off current) / 8 at 1.2 Gb/s, x2 to the 2.4 Gb/s preset; the excesses over it are unchanged: (1087.4 - 821.3) / 8 = 33.2625 x 2; was 76.025000. 1.12.18 (user ruling 2026-10-24, HBM2 rate): DERIVED, the measured per-channel standby scaled to the record's 2.4 Gb/s preset (x2, linear in rate, voltage unchanged; docs/derivations/hbm_gddr6_idd.md sec. 1.10); was 38.0125
  idd3n: 61.500000   # (1.12.46) (user ruling 2026-10-25, board offset): per-channel standby = (stack mean - 821.3 mA board power-off current) / 8 at 1.2 Gb/s, x2 to the 2.4 Gb/s preset; the excesses over it are unchanged: (1067.3 - 821.3) / 8 = 30.75 x 2; was 71.000000. 1.12.18 (user ruling 2026-10-24, HBM2 rate): DERIVED, the measured per-channel standby scaled to the record's 2.4 Gb/s preset (x2, linear in rate, voltage unchanged; docs/derivations/hbm_gddr6_idd.md sec. 1.10); was 35.5
  idd4r: 1382.900000   # (1.12.46) (user ruling 2026-10-25, board offset): IDD3N 61.5 + the read excess 1321.4 (unchanged); was 1392.400000. 1.12.18 (user ruling 2026-10-24, HBM2 rate): DERIVED, the measured per-channel standby scaled to the record's 2.4 Gb/s preset (x2, linear in rate, voltage unchanged; docs/derivations/hbm_gddr6_idd.md sec. 1.10); was 1356.9 (the read burst excess IDD4R - IDD3N = 1321.4 mA is ALREADY at the preset rate: x4 = both PCs x 2.4/1.2 Gb/s, 5.16 pJ/b; only the IDD3N baseline moves)
  idd4w: 950.150000   # (1.12.46) (user ruling 2026-10-25, board offset): IDD3N 61.5 + the write excess 888.65 (unchanged); was 959.650000. 1.12.18 (user ruling 2026-10-24, HBM2 rate): DERIVED, the measured per-channel standby scaled to the record's 2.4 Gb/s preset (x2, linear in rate, voltage unchanged; docs/derivations/hbm_gddr6_idd.md sec. 1.10); was 924.15 (write excess 888.65 mA already at the preset rate; only the baseline moves)
  idd5: 119.9125   # (1.12.50) (user ruling 2026-10-25, refresh at 350 ns): IDD2N 66.525 + the measured loop excess (1514.5 - 1087.4) / 8 = 53.3875 mA, no 266.7/260 period factor (the energy now takes the loop period 350 ns from trfc_ns); was 121.288255. (1.12.50) (user ruling 2026-10-25, board offset): IDD2N 66.525 + the refresh excess 54.763255 (unchanged); was 130.788255. 1.12.18 (user ruling 2026-10-24, HBM2 rate): DERIVED, the measured per-channel standby scaled to the record's 2.4 Gb/s preset (x2, linear in rate, voltage unchanged; docs/derivations/hbm_gddr6_idd.md sec. 1.10); was 92.77575481 (refresh excess over IDD2N unchanged; only the baseline moves)
  # 1.12.18 (user ruling 2026-10-23): refresh energy per REF = VDD x (IDD5 - IDD2N) x tRFC (+ VPP x (IPP5B - IPP2N) x tRFC where an IPP row exists): IDD2N baseline, the refresh interrupts the state
  idd2p: 46.5675   # (1.12.46) (user ruling 2026-10-25, board offset): IDD2N x 28/40 (the same Chatterjee ratio); was 53.2175. 1.12.20 (user ruling 2026-10-23, point 3): DERIVED precharge power-down current = IDD2N x 28/40 -- the IDD2P/IDD2N ratio of the HBM stack IDD table in N. Chatterjee et al., 'Architecting an Energy-Efficient DRAM System for GPUs', HPCA-23 2017, Table II (IDD2P 28, IDD2N 40 mA); no HBM IDD2P is published by a vendor or JEDEC (NO PUBLISHED SOURCE FOUND for a measured value). Was the un-sourced rule of thumb 7.0 mA
  trfc_ns: 350.0   # (1.12.50) (user ruling 2026-10-25): ENERGY ONLY -- the refresh energy per REF = VDD x (IDD5 - IDD2N) x 350 ns, the measured part's all-bank tRFC as the authors publish it (github.com/CMU-SAFARI/HBM-Power config/HBM2_1200MTs/timing.json: nRFC 210 at tCK 1666.7 ps = 350 ns, "the JEDEC HBM2 all-bank refresh time for 8 Gb channels"). The timing is the preset's (HBM2_2.4Gbps; a record trfc_ns times DDR3 only, through trfc_bases), unchanged. Stated conflict: the artifact's program_idd5() source reads "int tRFC = 160;" (266.7 ns) beside a "tRFC=350ns = 210 cycles" comment (docs/derivations/hbm_gddr6_idd.md sec. 1.1); the ruling takes 350 ns. Was 260.0
  trefi_ns: 3900.0
  source: "SAFARI HBM2 measurement (the JEDEC IDD loop conditions run on pseudo-channel 0 only, so IDD0 is ONE 1 KB PC activation per tRC, not the JESD235D Table 60 two-PC loop -- see idd0_loop; 1.12.18 wording; artifact all_idd_measurements.csv chip means): per-stack mA less the 821.3 mA board power-off current over 8 channels ((1.12.46), user ruling 2026-10-25; was 783.3): IDD0 (1125.1-821.3)/8, IDD2N (1087.4-821.3)/8, IDD3N (1067.3-821.3)/8, IDD4R = IDD3N + (3710.1-1067.3)/8 x 4 (rate factor), IDD4W = IDD3N + (2844.6-1067.3)/8 x 4, IDD5 = IDD2N + (1514.5-1087.4)/8 x 266.7/260 (refresh factor); IDD2P 7 mA stays the un-sourced column; tRFC 260 ns, tREFI 3.9 us; 8 channels per stack; 1.12.18 (user ruling 2026-10-24, HBM2 rate): the per-channel figures above are the 1.2 Gb/s MEASUREMENT; the row prices them at the preset 2.4 Gb/s -- IDD2N/IDD3N x 2 (clocked part linear in rate, voltage unchanged, as the HBM3 derivation), IDD0/IDD4R/IDD4W/IDD5 baselines shifted with them (activate, burst and refresh excesses unchanged; the burst excess was already x4 to the preset), DERIVED (docs/derivations/hbm_gddr6_idd.md sec. 1.10)"
  idd0_loop: ONE_PC_PER_TRC   # 1.12.18 (user ruling 2026-10-24, option 5): see hbm3.yaml; JESD235D Table 60 (pseudo channel mode) activates PC0 and PC1 each nRC
  vpp_act:   # 1.12.18 (user ruling 2026-10-24): activation VPP = ratio x the VDD activate+precharge energy (DERIVED, vendor estimator ratio)
    ratio: 0.061825   # XPE 4G column (VU37P): C44/C33. Device match: this record is a 4-high stack (stack_dies 4), XPE's 4 GB stack column; the 8G column is printed beside it
    device: "XPE VU37P 4G stack column (HBM_Data!C44/C33 = 38.61/624.51 mW)"
    alt_ratio: 0.103041
    alt_device: "XPE VU47P 8G stack column (HBM_Data!D44/D33 = 77.22/749.412 mW)"
    provenance: DERIVED
    source: "Xilinx Power Estimator (XPE) 2023.1.2, UltraScale+ workbook UltraScalePlus_XPE_2023_1_2.xlsm (vendor estimator), sheet HBM_Data: row 33 'VDD activate (read)' rail VCC_HBM 1.2 V and row 44 'VPP Activate' rail VCCAUX_HBM 2.5 V, column C '4G' (VU33P/VU35P/VU37P/VU57P) and column D '8G' (VU45P/VU47P), selector B = IF(part is VU45P/VU47P, D, C): C44/C33 = 38.61/624.51 = 0.061825, D44/D33 = 77.22/749.412 = 0.103041. An energy ratio (mW/mW at the same activity), so no voltage conversion is applied; XPE's own model scales each rail as (V/Vnom)^2, which a 1.1/1.8 V part would change by (1.8/2.5)^2/(1.1/1.2)^2 = 0.62 -- stated, not applied (the ruling prices the published ratio). The VDD part it multiplies is the measured SAFARI-derived VDD ACT energy (unchanged). HBM2 VPP is 2.5 V (Sohn et al., JSSC 52(1) 2017: VPPE is the wordline driver supply; JESD235D); the SAFARI 'ipp' column is NOT a VPP measurement (card residual / 2.5 V; docs/derivations/hbm_gddr6_idd.md sec. 1.8), hence the ratio."
  act_guard_nj_per_kb: { lo: 0.34, xpe_ceiling: 0.50, hi: 0.92, source: "lo 0.34: the IDD route through Chatterjee et al. HPCA-23 2017 Table II (VDD 1.2, IDD0 65, IDD3N 55, IDD2N 40 mA, tRC 47, tRAS 33 ns, 2 KB row: 816 pJ -> 408 pJ/KB at 1.2 V, 342-374 at 1.1 V); xpe_ceiling 0.50: XPE 2023.1.2 attribution ceiling (every access a miss, all VDD+VPP 'activate' power and the VDDQ miss term counted as ACT, VU47P 1.8 Gb/s, 64 B); hi 0.92: bottom-up model, O'Connor et al. MICRO-50 2017 Table 3 (909 pJ, 1 KB) / Chatterjee HPCA17 (112 fJ/bit = 0.92 nJ/KB). GUARD ONLY (printed by readEnergyGuardLines; never priced)" }
  io_share:   # (1.12.49) (user ruling 2026-10-25): the DQ read I/O INSIDE idd4r, so a host read prices it once
    idd4r_ma: 58.88
    idd4w_ma: 0.0
    provenance: DERIVED
    source: "The measured rows are VDDC + VDDQ: Olgun et al., MICRO 2026 (arXiv:2610.14244) Table 1 'VDDQ: I/O supply rail (powers the data I/O interface)' and Sec. 4.2 'to measure current (IDD values) on VDDC and VDDQ rails', VPP not reported; so idd4r already holds the DRAM's DQ read I/O, and the 1.12.35 host read added the VDDQ band centre 0.23 pJ/b on top (double count). Read share = that same band centre (iddq_band_pj_bit 0.19-0.27, centre 0.23 pJ/b) x 307.2 Gb/s (128-bit channel x 2.4 Gb/s) / 1.2 V = 58.88 mA, DERIVED: a host read now prices array (idd4r - 58.88 - idd3n) + I/O 0.23 pJ/b = the measured 5.16 pJ/b, and a PE read on the DRAM die (no DQ crossing) gives the share up. Write share 0: NO PUBLISHED SOURCE FOUND for an HBM2 DRAM-side write I/O energy, and the host write priced no VDDQ term, so writes are unchanged."
  # stack_floor_mw: removed (1.12.46) (user ruling 2026-10-25): NO per-stack floor. The 821.3 mA the floor came from is the board current with the HBM2 stack powered off, which the measurement subtracts as non-DRAM (Olgun et al., MICRO 2026 / arXiv:2610.14244 Sec. 4.3; github.com/CMU-SAFARI/HBM-Power config/HBM2_1200MTs/power.json and docs/explanation/idd-derivation.md: "board power-off current (821.3 mA)", "DRAM device only"). Was 469.98 mW per stack (783.3 mA x 1.2 V / 2). docs/derivations/hbm_gddr6_idd.md sec. 1.11
  background_guard_mw_stack: { lo: 860.0, hi: 1900.0, source: "XPE 2023.1.2 (UltraScale+) all DRAM rails idle per stack (HBM_Data B29, B31, B37, B43 + Static_Data rows 720-722 leakage), VU37P/VU47P columns, 1.2-1.8 Gb/s, 25 C typ .. 100 C max: 0.86-1.90 W. GUARD ONLY, never priced" }
# (1.12.61) (user ruling 2026-10-25): the data-dependent burst energy from the run's MEASURED DQ pin transitions between
# beats (1.12.58 counters), the authors' published relative model; the TSV and bank-group bus rates are not counted and
# stay at uniform random (0.5), the reference is uniform random on all three, so the record's IDD4R/IDD4W excess is the
# uniform-random value: E = E_record x pJ(dq, 0.5, 0.5) / pJ(0.5, 0.5, 0.5).
data_pattern:
  form: DQ_TOGGLE_RELATIVE
  floor_pj_bit: 3.1798
  c_dq: 1.04
  c_tsv: 1.4875
  c_bg: 1.41
  tsv_rate: 0.5        # not counted (the 2-bit TSV bus between beat i and i+2): uniform random
  bg_rate: 0.5         # not counted (burst-to-burst bank-group bus): uniform random
  ref_dq_rate: 0.5
  ref_tsv_rate: 0.5
  ref_bg_rate: 0.5
  apply_to_writes: true   # as the authors' configurations (datapattern.apply_to_writes); their fit is to reads
  provenance: DERIVED
  source: "Olgun et al., MICRO 2026 (arXiv:2610.14244) Sec. 5.3 (DQ toggles 2 -> 64: read +32.0 %, write +82.0 %; bank-group bus toggling +29.4 %) and the authors' model, github.com/CMU-SAFARI/HBM-Power docs/explanation/data-pattern-model.md: pJ/bit = 3.1798 + 1.04 dq_rate + 1.4875 tsv_rate + 1.41 bg_rate (least squares over 32 beat patterns, R^2 about 0.87), relative form IDD4R_eff = IDD3N + (IDD4R - IDD3N) x pJ(knobs) / pJ(reference); config/HBM2_1200MTs/power.json (apply_to_writes true). The record's burst is the standard IDD4R loop (5.14 pJ/b measured) taken as uniform random (the measured random loop is 4.78, -7 %): stated. ACT: no data term (Sec. 5.2: no significant variation across rows; VAMPIRE Sec. 5.1)."

component_factors: none   # HBM rows are measured means; no typical/maximum factor applies
termination:   # DQ termination electricals; the formula (terminationNJ) stays in the tool
  scheme: none
  source: "HBM: unterminated single-ended interposer I/O; the VDDQ band below prices the DQ"
iddq_band_pj_bit: { lo: 0.19, hi: 0.27, source: "HBM2/HBM3 VDDQ I/O energy band 0.19-0.27 pJ/bit (measured; 1.11.91 R8-8)" }
