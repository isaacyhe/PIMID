# PIMID shipped part record -- DDR4
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; provenance beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: DDR4
part: "D1z 8 Gb DDR4 (density part); timing/energy row MT40A Rev B x8-2400"
vendor: "SK hynix (density) / Micron (IDD row)"
generation: "1z"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 15.5                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 37.888  # measured FULL-DIE density, user capacity basis (D11)
density_source: "SK hynix D1z DDR4, 0.296 Gb/mm^2 (SemiAnalysis / TechInsights) x 128"
organization_preset: "DDR4_8Gb_x8"   # Ramulator org preset the run instantiates (default knobs)
timing_preset: "DDR4_2400R"         # Ramulator timing preset (default knobs)
channels: 1                   # channels the preset instantiates
channel_width_bits: 64   # 1.11.101 (step 2): JESD79-4C 2.x: a 64-bit data channel; one rank = 64 / device width devices
refresh_ladder:                    # JEDEC JESD79-4 extended temperature range: 2x refresh above 85 C
  - { above_c: 85.0, factor: 0.5 }

# ---- the part's measured data (1.11.104 step 1 transcribed it, cross-checked; 1.11.105 step 2: the only source) ----
idd:
  basis: "per device"
  channels_basis: 1
  provenance: CALIBRATED
  idd3n_bank_state: ALL_BANKS
  vdd: 1.2
  idd0: 48.0
  idd2n: 34.0
  idd3n: 43.0
  idd4r: 135.0
  idd4w: 123.0
  idd5: 457.4
  # 1.12.18 (user ruling 2026-10-23): refresh energy per REF = VDD x (IDD5 - IDD2N) x tRFC (+ VPP x (IPP5B - IPP2N) x tRFC where an IPP row exists): IDD2N baseline, the refresh interrupts the state
  idd2p: 25.0
  trfc_ns: 350.0
  trefi_ns: 7800.0
  source: "Micron MT40A 8 Gb DDR4 Rev B Table 148 p.332, x8, DDR4-2400, MAXIMA; typical via the component factors"
  ipp: { ipp2n: 3.0, ipp3n: 3.0, vpp: 2.5, ipp0: 3.0, ipp4r: 3.0, ipp4w: 3.0, ipp5b: 47.5714285714, source: "MT40A Rev B T148 p.332 + note 22 p.334; VPP p.1; 1.12.18: IPP0 3 (T148 p.332, x8); IPP4R / IPP4W = IPP0 (p.314: IPP0 is the IPP of the active cases IDD0, IDD1, IDD4R, IDD4W); IPP5B DERIVED from the distributed-refresh row exactly as idd5 is from IDD5R (user ruling 2026-10-25, second supply rails): IPP3N + (IPP5R 5 - IPP3N 3) x tREFI 7800 / tRFC 350 = 47.571 mA, so VPP x (IPP5B - IPP2N) x tRFC = VPP x (IPP5R - IPP3N) x tREFI = 39.0 nJ per REF" }
component_factors:   # typical / maximum per component; applied by typicalFromSpec
  standby: 0.576
  standby_premium: 0.607638888889
  act: 0.54
  burst_rd: 0.553
  burst_wr: 0.43
  refresh: 0.83
  pd: 0.576
  source: "Shi et al. [S] per-component ratios (standby 0.576, premium 0.350/0.576, act 0.540, burst 0.553 rd / 0.430 wr, pd 0.576); refresh 0.83 from Ghose [G]"
# (1.12.82) (user ruling 2026-10-27): the data-dependent column-burst energy, transferred from the
# DDR3 measurement (NO PUBLISHED SOURCE FOUND for a DDR4 measurement of the dependence). Relative form, normalised at
# uniform-random data: E_burst = E_record x (1 + k x (f_ones - 0.5)), f_ones = the 1 bits of the run's raw line data
# (the array stores raw data; DBI acts on the pins only).
data_pattern:
  form: ONES_LINEAR
  read_ones: 0.1733
  write_ones: -0.0835
  provenance: DERIVED
  source: "Transfer from DDR3 (params/dram/ddr3.yaml data_pattern): Ghose et al., SIGMETRICS 2018 (arXiv:1807.05102) Table 5 bank+column interleaving, vendor means, I/O-driver corrected (vendor A 230/434 read, 111/311 write). The authors state that 'due to the large number of similarities between the design of DDR3 memory and DDR4 memory, we believe that the general trends observed in our characterization should apply to DDR4 DRAM as well' (Sec. 3.2), leaving DDR4 to future work. Assumptions stated: the same relative sensitivity of the core burst to the 1s fraction in DDR4 (planar DRAM core, same bank/column datapath); DDR4 measured data: NO PUBLISHED SOURCE FOUND (Mathew et al. DATE 2018 and Shi et al. arXiv:2411.17960 vary no data)."

termination:   # DQ termination electricals; the formula (terminationNJ) stays in the tool
  scheme: POD
  vddq: 1.2
  ron_rd: 34.0
  rtt_rd: 40.0
  ron_wr: 34.0
  rtt_wr: 120.0
  source: "POD12 (JESD8-24); 34/40/120 = MT40A p.315 IDD conditions"
