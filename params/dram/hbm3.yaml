# PIMID shipped part record -- HBM3
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; provenance beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: HBM3
part: "H5VG7HMD83X020R D1z 16 Gb HBM3 core die, 8-high 16 GB stack (user ruling HBM3-PART (a) 2026-10-05); IDD row derived from the HBM2 measurement"
vendor: "SK hynix"
generation: "1z"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 15.5                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 20.48  # measured FULL-DIE density, user capacity basis (D11)
density_source: "SK hynix HBM3 D1z 16 Gb core die, 0.16 Gb/mm^2 (SemiAnalysis; TechInsights floorplan analysis of H5VG7HMD83X020R) x 128"
organization_preset: "HBM3_8Gb"   # 1.11.102: 8 Gb per channel x 16 channels = 16 GB stack = 8 x 16 Gb dies (JESD238: two channels per die); HBM3_4Gb was an 8 GB stack of 8 Gb dies
timing_preset: "HBM3_6.4Gbps"         # Ramulator timing preset (default knobs)
channels: 16                   # channels the preset instantiates per stack
channel_width_bits: 64   # 1.11.101 (step 2): JESD238B 2.x: sixteen 64-bit channels per stack, each two 32-bit pseudo-channels
stack_dies: 8                 # the shipped 8-high stack (SK hynix 16 GB HBM3; the 12-high 24 GB part is another record)
die_capacity_gb: 16.0          # = preset 1024 MB/channel x 16 channels x 8 / 8 dies = 16 Gb: the density part's own capacity (ruling 16, user (a) 2026-10-05)
refresh_ladder:                    # HBM temperature-compensated refresh: 2x 85-95 C, 4x above 95 C (Xilinx PG276, Intel UG-20031; JESD238 refresh modes)
  - { above_c: 85.0, factor: 0.5 }
  - { above_c: 95.0, factor: 0.25 }

