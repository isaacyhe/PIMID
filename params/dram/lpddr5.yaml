# PIMID shipped part record -- LPDDR5
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; its source beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: LPDDR5
part: "D1z 16 Gb LPDDR5 (density part); IDD row Micron Y52P LPDDR5X x16 7500 maxima"
vendor: "Samsung (density) / Micron (IDD row)"
generation: "1z"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 15.5                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 46.566621191450665  # measured FULL-DIE density, user capacity basis (D11)
density_source: "Samsung D1z 16 Gb LPDDR5, 16 Gb / 43.98 mm^2 (TechInsights) x 128"
organization_preset: "LPDDR5_16Gb_x16"   # Ramulator org preset the run instantiates (default knobs); 1.12.44 (user ruling 2026-10-25): the 16 Gb die the IDD row (Micron Y52P) and the density part describe (was LPDDR5_8Gb_x16)
timing_preset: "LPDDR5_6400"         # Ramulator timing preset (default knobs)
channels: 4                   # 1.12.4 (ruling 2 (c), 2026-10-15): the deployed package, four independent x16 channels, one die each (JESD209-5B multi-channel package; the IDD row's own sheet lists the x64 four-channel packages). 1 was the bare die: 1 GB, 12.8 GB/s, 16 banks, one bank per PE in a 16-PE BANK cell
channel_width_bits: 16   # 1.11.101 (step 2): JESD209-5B 2.x: a 16-bit channel served by one x16 die
refresh_ladder:                    # JEDEC JESD209-5: derated refresh above 85 C (one step modelled)
  - { above_c: 85.0, factor: 0.5 }

# ---- the part's measured data (1.11.104 step 1 transcribed it, cross-checked; 1.11.105 step 2: the only source) ----
idd:
  basis: "per device"
  channels_basis: 1
  idd3n_bank_state: UNVERIFIED
  vdd: 1.05
  idd0: 53.0
  idd2n: 32.5
  idd3n: 40.0
  idd4r: 338.666666667
  idd4w: 232.0
  idd5: 205.0
  # 1.12.18 (user ruling 2026-10-23): refresh energy per REF = VDD x (IDD5 - IDD2N) x tRFC (+ VPP x (IPP5B - IPP2N) x tRFC where an IPP row exists): IDD2N baseline, the refresh interrupts the state
  idd2p: 3.9
  trfc_ns: 280.0   # 1.12.44: tRFCab of the 16 Gb die (JESD209-5C Table 240 p.287; Y52P Table 6 p.11) = LPDDR5.cpp tRFCab_TABLE at the 16 Gb preset; was 210, the 8 Gb value
  trefi_ns: 3906.0
  source: "Micron Y52P LPDDR5X public sheet Table 18 pp.42-43, x16, 7500 Mb/s column, MAXIMA; the burst increments scaled x 6400/7500 to the modelled LPDDR5-6400 (1.11.91 item 11): IDD4R = 40 + (390-40) x 6400/7500, IDD4W = 40 + (265-40) x 6400/7500; tRFCab 280 ns (16 Gb; 1.12.44, was 210 = 8 Gb); tREFI 3906 ns = LPDDR5.cpp tREFI_BASE"
  standby_clock: { scale: 0.853333333333, source: "(1.12.79) the row is the 7500 Mb/s column, the model runs LPDDR5-6400: the standby states' clock-driven current scales with the clock, so the background standby (IDD2N/IDD3N on VDD2H, IDD2N1/IDD3N1 on VDD1) is priced x 6400/7500; power-down, refresh and the activate / burst baselines keep the row." }
  iddq: { iddq3n: 0.6, iddq4r: 95.576, iddq4w: 0.6, vddq: 0.5, source: "Y52P T18 pp.42-43 (IDD3NQ/IDD4RQ/IDD4WQ), VDDQ p.1; not factored. (1.12.78) IDD4RQ is the 7500 Mb/s column: its excess is a switching current proportional to the data rate, so it is scaled x 6400/7500 to the modelled LPDDR5-6400 like the IDD4R/IDD4W rows (1.11.91 item 11): IDD4RQ = 0.6 + (111.9 - 0.6) x 6400/7500 = 95.576 mA; the read VDDQ energy per bit is then the 7500 column one, (111.9 - 0.6) mA x 0.5 V / (7.5 Gb/s x 16) = 0.464 pJ/bit (it was 0.544: the 7500 current priced per access at the 6400 burst time)." }
  ipp: { ipp2n: 1.5, ipp3n: 2.8, vpp: 1.8, ipp0: 3.8, ipp4r: 15.7706666667, ipp4w: 14.4906666667, ipp5b: 24.0, source: "Y52P T18 pp.42-43 x16 7500 column on the 1.8 V VDD1 rail (LPDDR5 has no VPP ball): IDD2N1 1.5, IDD3N1 2.8, IDD01 3.8, IDD51 24.0 (all-bank refresh, the IDD52H row's loop); user ruling 2026-10-25 (second supply rails): IDD4R1 / IDD4W1 burst increments scaled x 6400/7500 to the modelled LPDDR5-6400 as the VDD2H row is (1.11.91 item 11): IPP4R = 2.8 + (18.0 - 2.8) x 6400/7500, IPP4W = 2.8 + (16.5 - 2.8) x 6400/7500; maxima on both ends (no typical ratio applied for VDD1)" }
component_factors:   # typical / maximum per component; applied by typicalFromSpec
  standby: 0.57
  standby_premium: 0.631578947368
  act: 0.5
  burst_rd: 0.6
  burst_wr: 0.5
  refresh: 0.83
  pd: 0.57
  source: "the DDR5/LPDDR5/GDDR6 class set (1.11.91): standby 0.57, premium 0.36/0.57, act 0.5, burst 0.6 rd / 0.5 wr, refresh 0.83, pd 0.57"
# (1.12.84) (user ruling 2026-10-27): the data-dependent column-burst energy, TRANSFERRED from the DDR3 measurement on the
# planar-core argument. No author statement
# extends the DDR3 result to LPDDR5. Relative form, normalised at uniform-random data:
# E_burst = E_record x (1 + k x (f_ones - 0.5)), f_ones = the 1 bits of the raw line data (the array stores raw data; DBI-DC acts on the pins only).
data_pattern:
  form: ONES_LINEAR
  read_ones: 0.1733
  write_ones: -0.0835
  source: "Transfer from DDR3 (params/dram/ddr3.yaml data_pattern): Ghose et al., SIGMETRICS 2018 (arXiv:1807.05102) Table 5 bank+column interleaving, vendor means, I/O-driver corrected. ASSUMPTION, stated: LPDDR5 is a planar DRAM whose column datapath (bitline sense amplifiers, local/global data lines, bank select) shares the DDR3 structure, so its core burst current is taken to have the same relative sensitivity to the 1s fraction. NO author statement supports this for LPDDR5 (Ghose et al. name DDR4 only), and LPDDR5 differs from DDR3 in prefetch, bank grouping, voltage and I/O."

termination:   # DQ termination electricals; the formula (terminationNJ) stays in the tool
  scheme: LVSTL
  vddq: 0.5
  ron_rd: 40.0
  rtt_rd: 0.0
  ron_wr: 40.0
  rtt_wr: 0.0
  source: "LVSTL at 0.5 V (JESD209-5): unterminated at this rate, RON 40"
