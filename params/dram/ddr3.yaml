# PIMID shipped part record -- DDR3
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; its source beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: DDR3
# 1.12.25: user rulings 2026-10-24: the DDR3 DEFAULT is ONE consistent 4 Gb x8 die at 1.5 V. The currents are the
# Micron 4 Gb die Rev E x8 DDR3-1600 column of Table 20, titled "IDD Maximum Limits Die Rev. E for 1.35/1.5V
# Operation" (Micron MT41K 4 Gb DDR3L (4Gb_DDR3L.pdf Rev. R 09/18) p.44), the same column the 1.5 V sheet prints
# (Micron MT41J 4 Gb automotive DDR3 (4gb_automotive_ddr3_sdram.pdf Rev. B 04/13) Table 20 Die Rev E p.44: IDD0 55, IDD2P1 32, IDD2N 32,
# IDD3N 38, IDD4R 157, IDD4W 125, IDD5B 235 mA, identical). The organisation is that die's (DDR3_4Gb_x8: 8 banks x
# 64K rows x 1K columns x 8 = 4 Gb, 1 KB page; MT41K Table 2 p.2), and the density part is a 4 Gb die too. Before
# 1.12.25 the record priced the 4 Gb currents on an 8 Gb organisation (DDR3_8Gb_x8, 8 Gb tRFC 350 ns) at 1.35 V.
# VDD = VDDQ = 1.5 V with SSTL-15 termination (JESD79-3E); DDR3L (1.35 V, SSTL-135, the same currents) is the
# variant memory.dram.ddr3_variant: DDR3L selects. tRFC = the sheet's 260 ns (the tRFC the IDD5B loop runs at),
# for timing and refresh energy; memory.dram.trfc_basis: jedec selects JESD79-3E's 300 ns.
part: "4 Gb x8 DDR3-1600 at 1.5 V (currents: Micron MT41K/MT41J 4 Gb die Rev E; density part: SK hynix H5TQ4G83xFR-class 23 nm 4 Gb, ISSCC 2012 paper 2.3)"
vendor: "SK hynix"
generation: "3x/2x"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 25.0                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 16.569579288025892  # measured FULL-DIE density, user capacity basis (D11)
density_source: "SK hynix 23 nm 4 Gb DDR3 SDRAM, 30.9 mm^2 die (ISSCC 2012 paper 2.3, 6F2 open-bitline): 4 Gb / 30.9 mm^2 x 128"
organization_preset: "DDR3_4Gb_x8"   # Ramulator org preset the run instantiates (default knobs); 1.12.25: the 4 Gb die the currents describe (was DDR3_8Gb_x8)
timing_preset: "DDR3_1600K"         # Ramulator timing preset (default knobs); 1.12.38 (user ruling 2026-10-25): 1600K 11-11-11 = Micron MT41K -125 (Rev Q p.1 Table 1, 13.75 ns), the part the currents and tRFC 260 ns come from (was DDR3_1600H 9-9-9, a JEDEC bin no Micron 4 Gb part ships)
channels: 1                   # channels the preset instantiates
channel_width_bits: 64   # 1.11.101 (step 2): JESD79-3F 2.x: a 64-bit data channel; one rank = 64 / device width devices
refresh_ladder:                    # JEDEC JESD79-3 extended temperature range: 2x refresh (tREFI/2) above 85 C
  - { above_c: 85.0, factor: 0.5 }

# ---- the part's measured data (1.11.104 step 1 transcribed it, cross-checked; 1.11.105 step 2: the only source) ----
idd:
  basis: "per device"
  channels_basis: 1
  idd3n_bank_state: ALL_BANKS
  vdd: 1.5                         # 1.12.25: DDR3 at 1.5 V (variants.DDR3); DDR3L 1.35 V is variants.DDR3L
  idd0: 55.0
  idd2n: 32.0
  idd3n: 38.0
  idd4r: 157.0
  idd4w: 125.0
  idd5: 235.0
  # 1.12.18 (user ruling 2026-10-23): refresh energy per REF = VDD x (IDD5 - IDD2N) x tRFC (+ VPP x (IPP5B - IPP2N) x tRFC where an IPP row exists): IDD2N baseline, the refresh interrupts the state
  idd2p: 32.0
  # (1.12.48) (user ruling 2026-10-25): the x16 device of the same die prices its OWN column (memory.dram.device_width: x16
  # selects it); the columns Table 20 prints as "All" (IDD2N, IDD2P1, IDD5B) are inherited from the row above. Before this the
  # x16 organisation was priced on the x8 currents.
  by_width:
    x16:
      idd0: 66.0
      idd3n: 47.0
      idd4r: 235.0
      idd4w: 171.0
      source: "Micron MT41K 4 Gb DDR3L (4Gb_DDR3L.pdf Rev. Q 12/17) Table 20 'IDD Maximum Limits Die Rev. E for 1.35/1.5V Operation' p.43, x16, DDR3-1600 column, MAXIMA at TC 85 C: IDD0 66, IDD3N 47, IDD4R 235, IDD4W 171 mA (x4/x8: 55, 38, 157, 125); IDD2N 32, IDD2P1 32 and IDD5B 235 mA are 'All' widths (the row above); typical via the same component factors"
  trfc_ns: 260.0                   # 1.12.25: the 4 Gb sheet's tRFC (trfc_bases.datasheet); was 350 ns, the 8 Gb value
  trefi_ns: 7800.0
  source: "Micron MT41K 4 Gb DDR3L (4Gb_DDR3L.pdf Rev. R 09/18) Table 20 'IDD Maximum Limits Die Rev. E for 1.35/1.5V Operation' p.44 (p.43 in Rev. Q), x8, DDR3-1600 column, MAXIMA at TC 85 C (IDD5B burst refresh; IDD2P1 fast exit); the same column as Micron MT41J 4 Gb automotive DDR3 (4gb_automotive_ddr3_sdram.pdf Rev. B 04/13) Table 20 p.44; typical via the component factors"
component_factors:   # typical / maximum per component; applied by typicalFromSpec
  standby: 0.566
  standby_premium: 0.648409893993
  act: 0.43
  burst_rd: 0.736
  burst_wr: 0.542
  refresh: 0.829
  pd: 0.29224   # (1.12.47) (user ruling 2026-10-25): standby 0.566 x the measured fast power-down ratio IDD2P1/IDD2N 0.51633 (three-vendor mean of 1 - 0.658 / 1 - 0.306 / 1 - 0.487 = 0.342 / 0.694 / 0.513, Ghose et al. Sec. 4.5; the mean, as every other factor of this set). This sheet prints IDD2P1 = IDD2N = 32 mA, so IDD2P_t = 0.29224 x 32 = 9.352 mA = 0.51633 x IDD2N_t 18.112 mA. Band (vendor A..B): 0.194 .. 0.393 (IDD2P_t 6.19 .. 12.57 mA). Was 0.566 (power-down = precharged standby, no saving)
  source: "[G] Ghose et al. per-component typical/maximum ratios, DDR3 set (measured on DDR3L-1600 modules; 1.12.25: applied unchanged at 1.5 V -- the ratios are typical/maximum of the same current, and Table 20 publishes one maximum for both voltages); pd ((1.12.47), user ruling 2026-10-25): the standby factor x the measured fast power-down ratio IDD2P1/IDD2N, three-vendor mean 0.51633 (Ghose et al. Sec. 4.5: power-down cuts the measured IDD2N by 65.8/30.6/48.7% for vendors A/B/C), because this sheet IDD2P1 equals its IDD2N"
# (1.12.61) (user ruling 2026-10-25): the data-dependent column-burst energy, priced from the run's MEASURED line data
# (1.12.58 counters: the 1 bits of every line). Relative form, normalised at uniform-random data (1s fraction 0.5), so
# the record's IDD4R/IDD4W excess is the uniform-random value: E_burst = E_record x (1 + k x (f_ones - 0.5)).
data_pattern:
  form: ONES_LINEAR
  read_ones: 0.1733     # 0.327 (VAMPIRE Table 5, bank+column interleaving, vendor mean of dIone x 512 / burst excess at 256 1s) x 0.530 (I/O-driver correction, vendor A: 230 / 434 mA, Fig. 16 vs Fig. 15)
  write_ones: -0.0835   # -0.234 (Table 5, write, same normalisation) x 0.357 (I/O / ODT correction, vendor A: 111 / 311 mA)
  source: "Ghose et al., 'What Your DRAM Power Models Are Not Telling You', SIGMETRICS 2018 (arXiv:1807.05102): Sec. 5.1 (current linear in the number of 1s, R^2 >= 0.990; read rises, write falls with 1s), Fig. 15/16 (vendor A span 434 / 311 mA raw, 230 / 111 mA after the I/O-driver estimate), Appendix Table 5 bank+column interleaving (read Izero/dIone A 277.13/0.267, B 223.61/0.152, C 266.51/0.099; write A 537.58/-0.249, B 420.43/-0.179, C 323.22/-0.072 mA per module), active standby from the VAMPIRE model code (dramSpec.cpp: 38.3/47.9/33.4 mA). Per-vendor read k (raw) 0.19-0.44, write -0.13..-0.29. Bit toggling between consecutive bursts (Sec. 5.2, <= 0.08 of the excess) is NOT priced: the counters see transitions inside a line only. The interleaving class is not measured; bank+column is taken (others: read 0.27-0.46, write -0.19..-0.26 raw). ACT: no data term (Sec. 5.1: no notable dependence of activate/precharge on the stored data)."

termination:   # DQ termination electricals; the formula (terminationNJ) stays in the tool
  scheme: SSTL
  vddq: 1.5                        # 1.12.25: SSTL-15 (variants.DDR3); DDR3L's SSTL-135 is variants.DDR3L
  ron_rd: 34.0
  rtt_rd: 40.0
  ron_wr: 34.0
  rtt_wr: 120.0
  source: "SSTL-15 at VDDQ 1.5 V: JESD79-3E Table 22 p.111 (VDD = VDDQ = 1.5 V +-0.075 V), Table 38 p.128 (RON34 = RZQ/7, RZQ = 240 ohm), Table 41 p.132 (ODT RTT), Figure 10 p.28 (MR1 RTT_Nom RZQ/6 = 40 ohm, RTT_WR RZQ/2 = 120 ohm); 34/40/120 = the IDD measurement conditions of both sheets (MT41K p.33, MT41J p.31: RON RZQ/7, RTT,nom RZQ/6, RTT(WR) RZQ/2)"
# 1.12.25: the voltage variants of this die (optional block; memory.dram.ddr3_variant selects one). The record's
# own idd.vdd and termination.vddq are the default variant's and must equal it; a selected variant replaces both.
variants:
  default: DDR3
  DDR3:  { vdd: 1.5,  vddq: 1.5,  source: "DDR3 (1.5 V): Micron MT41J 4 Gb automotive DDR3 (4gb_automotive_ddr3_sdram.pdf Rev. B 04/13) p.1 'VDD = VDDQ = 1.5V +-0.075V'; JESD79-3E Table 22 p.111; SSTL-15 termination (JESD79-3E Tables 38/41)" }
  DDR3L: { vdd: 1.35, vddq: 1.35, source: "DDR3L (1.35 V): Micron MT41K 4 Gb DDR3L (4Gb_DDR3L.pdf Rev. R 09/18) p.1 'VDD = VDDQ = 1.35V (1.283-1.45V)'; SSTL-135 termination (JESD79-3-1 Tables 38/41, RZQ = 240 ohm, the same 34/40/120 trio); Table 20 is the same column" }
# 1.12.25: the tRFC this die is timed and refreshed at (optional block; memory.dram.trfc_basis selects one). The
# selected value is the Ramulator timing (tRFC override) AND the refresh energy's tRFC; the record's idd.trfc_ns is
# the default basis's and must equal it.
trfc_bases:
  default: datasheet
  datasheet: { trfc_ns: 260.0, source: "Micron MT41K 4 Gb DDR3L (4Gb_DDR3L.pdf Rev. R 09/18) Table 58 p.86 'tRFC - 4Gb MIN = 260' ns (also Micron MT41J 4 Gb automotive DDR3 (4gb_automotive_ddr3_sdram.pdf Rev. B 04/13)); the IDD5B loop runs at tRFC(min) of the part" }
  jedec:     { trfc_ns: 300.0, source: "JESD79-3E Table 61 p.158 'Refresh parameters by device density': tRFC 4Gb 300 ns" }
