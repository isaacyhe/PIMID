# PIMID shipped part record -- GDDR6
# 1.11.104 (IDD-RECORDS step 1): the idd / component_factors / termination / iddq_band blocks below carry the part's measured data; since 1.11.105 (step 2) this record is the ONLY source of them (the code table is gone).
# 1.11.94: ONE record per part; every field required; its source beside the value.
# Step 2 of the parameter-file migration (1.11.101): this record is the ONLY source of these
# values; the code tables are gone. The loader validates the record's own consistency and REFUSES
# a missing or inconsistent field.
# To model another part: copy this file, change every field with its own source,
# and point PIMID_PARAMS at the directory holding it. Partial records are refused.
technology: GDDR6
part: "K4Z80165BC 8 Gb GDDR6 (density part); IDD row Samsung K4Z80325BC per channel"
vendor: "Samsung"
generation: "1z"            # vendor generation label of the DENSITY part (sweep-94 row 13)
feature_nm: 15.5                  # mid-value of the published range for this generation
cell_factor_f2: 6                  # buried-wordline cell, area = 6 F^2 (bitline pitch 2 F)
density_mb_per_mm2: 27.653254118282472  # measured FULL-DIE density, user capacity basis (D11)
density_source: "Samsung K4Z80165BC D1z 8 Gb GDDR6, 8 Gb / 37.03 mm^2 whole die (TechInsights floorplan) x 128"
organization_preset: "GDDR6_8Gb_x16"   # Ramulator org preset the run instantiates (default knobs)
timing_preset: "GDDR6_2000_1350mV_double"         # Ramulator timing preset (default knobs)
channels: 2                   # channels the preset instantiates
channels_per_die: 2   # (1.12.52) (user ruling 2026-10-25, GDDR6 die count): one device = one die carries both channels (JESD250D 4.1 "devices having 2 channels/device"; Samsung K4Z80325BC Table 17: 8 Gb = 2 x 4 Gb channels); the preset's 1024 MB device capacity spans both
channel_width_bits: 16   # 1.11.101 (step 2): JESD250D 4.1: two independent 16-bit channels per device
refresh_ladder:                    # JEDEC JESD250: 2x refresh above 85 C (one step modelled)
  - { above_c: 85.0, factor: 0.5 }

# ---- the part's measured data (1.11.104 step 1 transcribed it, cross-checked; 1.11.105 step 2: the only source) ----
idd:
  basis: "per channel"
  channels_basis: 1
  idd3n_bank_state: ONE_BANK
  vdd: 1.35
  idd0: 215.0
  idd2n: 155.0
  idd3n: 230.0
  idd4r: 610.0
  idd4w: 735.0
  idd5: 395.0
  # 1.12.18 (user ruling 2026-10-23): refresh energy per REF = VDD x (IDD5 - IDD2N) x tRFC (+ VPP x (IPP5B - IPP2N) x tRFC where an IPP row exists): IDD2N baseline, the refresh interrupts the state
  idd2p: 115.0
  ipp: { ipp2n: 5.0, ipp3n: 5.0, vpp: 1.8, ipp4r: 5.0, ipp4w: 5.0, ipp5b: 38.5, source: "Samsung K4Z80325BC Rev 1.3 Table 82 p.146 x32 HC14 per device IPP3N 10, IPP5 77 mA, halved to one channel; IPP2N / IPP4R / IPP4W = IPP3N (note 2 p.146); VPP 1.8 V (Table 79 p.136); user ruling 2026-10-25 (second supply rails)" }
  trfc_ns: 120.0
  trefi_ns: 1900.0
  source: "Samsung K4Z80325BC GDDR6 Table 82 (HC14), per DEVICE maxima {430, 310, 460, 1220, 1470, 790, IDD2P 230} halved to one of the two channels; typical via the component factors"
  e_actpre_pj_override: 3240.0   # IDD7 route: 1.35 V x (IDD7 1640 - IDD4R 1220) mA / 175 M ACT/s per device = 3240 pJ per channel activation at the maxima (well-conditioned: the two loops share the read stream); typicalFromSpec x f.act. 175 M/s = Table 90 pp.152-155: 4 ACT/READA per 80-nCK loop per channel = one per 20 nCK x 0.57 ns (Table 91), x 2 channels
  # user ruling 2026-10-25 (second supply rails): the VPP rail. Samsung K4Z80325BC Table 82 p.146 x32 HC14 per device: IPP3N 10 (note 2: applies to IDD2x, IDD3x, IDD4x and IDD6),
  # IPP5 77, IPP7 31, IPP0 14 mA; Table 79 p.136 VPP 1.8 V; halved to one channel like the VDD row. IPP2N = IPP4R = IPP4W = IPP3N (note 2). IPP0 is NOT entered: the
  # activation VPP takes the IDD7 route like the VDD part (the IDD0 route is ill-conditioned): VPP x (IPP7 31 - IPP3N 10) mA / 175 M ACT/s per device = 216 pJ per channel ACT,
  # at the maximum (VPP: not scaled by f.act).
  vpp_actpre_pj_override: 216.0
component_factors:   # typical / maximum per component; applied by typicalFromSpec
  standby: 0.57
  standby_premium: 0.631578947368
  act: 0.5
  burst_rd: 0.6
  burst_wr: 0.5
  refresh: 0.83
  pd: 0.57
  source: "the DDR5/LPDDR5/GDDR6 class set (1.11.91): standby 0.57, premium 0.36/0.57, act 0.5, burst 0.6 rd / 0.5 wr, refresh 0.83, pd 0.57"
# (1.12.85) (user ruling 2026-10-27): the data-dependent column-burst energy, TRANSFERRED from the DDR3 measurement on the
# planar-core argument. No author statement
# extends the DDR3 result to GDDR6. Relative form, normalised at uniform-random data:
# E_burst = E_record x (1 + k x (f_ones - 0.5)), f_ones = the 1 bits of the raw line data (the array stores raw data; DBIdc acts on the pins only).
data_pattern:
  form: ONES_LINEAR
  read_ones: 0.1733
  write_ones: -0.0835
  source: "Transfer from DDR3 (params/dram/ddr3.yaml data_pattern): Ghose et al., SIGMETRICS 2018 (arXiv:1807.05102) Table 5 bank+column interleaving, vendor means, I/O-driver corrected. ASSUMPTION, stated: GDDR6 is a planar DRAM whose column datapath (bitline sense amplifiers, local/global data lines, bank select) shares the DDR3 structure, so its core burst current is taken to have the same relative sensitivity to the 1s fraction. NO author statement supports this for GDDR6 (Ghose et al. name DDR4 only), and GDDR6 differs from DDR3 in prefetch, bank grouping, voltage and I/O."

termination:   # DQ termination electricals; the formula (terminationNJ) stays in the tool
  scheme: POD
  vddq: 1.35
  ron_rd: 40.0
  rtt_rd: 60.0
  ron_wr: 40.0
  rtt_wr: 120.0
  source: "POD at 1.35 V per JESD250D; rd 40 + 60 = Samsung K4Z80325BC p.166 driver/termination; wr 120 = p.144 IDD 'All ODTs ... ZQ/2'"
