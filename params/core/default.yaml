# PIMID core part record (1.11.97, sweep-94 rulings 27 and 28: R2313 (b),
# R2355 (b), R2537, R2476). One coherent set for the two decoded timing cores
# zsim runs (InOrderCore, OOOCore): the front-end penalties they charge, the
# wrong-path fetch they model, and the retire width McPAT prices. Fields are
# keyed per core type because the two cores differ. A config's
#   core.in_order.mispredict_penalty_cycles / core.in_order.resteer_penalty_cycles
#   core.ooo.mispredict_penalty_cycles      / core.ooo.fetch_width_bytes
# replaces a field for that run (every core of that type, host and device) and
# is reported as the user's number. in_order.fetch_width_bytes is set by this
# record only. The environment variables
# PIMID_INORDER_MISPRED_PENALTY / PIMID_INORDER_RESTEER_PENALTY still override
# the in-order values inside the core (sensitivity studies), as before.
#
# Stage numbers used below are the ones zsim's OOOCore defines
# (external/zsim/src/ooo_core.cpp:49-52, "more or less matched to Westmere"):
#   FETCH_STAGE 1, DECODE_STAGE 4, ISSUE_STAGE 7, DISPATCH_STAGE 13.
#
# in_order
#   mispredict_penalty_cycles: 7. A conditional direction mispredict is known
#     only when the branch EXECUTES (in_order_core.cpp: "In-order cores resolve
#     the branch at execute"); the refill bubble is the fetch-to-issue depth.
#     InOrderCore defines no stage list of its own; it has always charged 7 =
#     ISSUE_STAGE, the OOO model's fetch-to-issue depth (in_order_core.cpp
#     ctor comment, through 1.11.96: "mispredPenalty = 7"), cross-read against
#     Cortex-A53-class short in-order pipelines (~8 cycles). Unchanged value.
#     McPAT's in-order pipeline depth is this value (main.cpp
#     inorderTimingPipelineDepth()).
#   resteer_penalty_cycles: 4. The DECODE-depth resteer (sweep-94 R2313 (b),
#     refined by the user ruling (a) of 2026-10-03): charged when a TAKEN
#     DIRECT branch (jcc taken, call rel) misses the BTB -- the decoder
#     computes the target from the instruction and redirects fetch behind
#     decode, so the refill is the fetch-to-decode depth; by the convention
#     that gives 7 = ISSUE_STAGE above, DECODE_STAGE = 4. An indirect jmp/call
#     or return whose target the BTB/RAS missed is resolved only at EXECUTE
#     and charges mispredict_penalty_cycles (1.11.98; 1.11.97 charged the
#     resteer for those, 1.11.96 the full 7 for every miss and nothing for a
#     direct-branch BTB miss, which it did not look up).
#   retire_width: issue. InOrderCore issues and commits on one cursor
#     (in_order_core.h: "curCycle ... in-order issue/commit cursor"); it
#     retires exactly what it issued, so its retire width IS its issue width
#     (pim.pe.issue_width, resolved as main.cpp inorderTimingIssueWidth()).
#     Only "issue" is accepted: an integer would price a retire limit the
#     timing core does not have.
#   fetch_width_bytes: 16 (PIMID (1.12.71), user ruling 2026-10-26 (1)). The
#     bytes one instruction-cache read delivers: a processing element's
#     instruction cache is read at its fetch width, not a whole line per
#     access, as Ariane's 16 kB 4-way instruction cache delivers its 32-bit
#     fetch in one cycle (F. Zaruba, L. Benini, "The Cost of
#     Application-Class Processing", IEEE TVLSI 27(11), 2019, Sec. II and
#     Table II: fetch latency 1, fetch width 32 bit, 22 nm FDX). The guest
#     code is x86, so the width is an x86 in-order core's: Knights Corner,
#     the in-order dual-issue x86 core (22 nm, Pentium-based dual pipeline),
#     "can handle 16 bytes or two instructions per clock cycle" (A. Fog, "The
#     microarchitecture of Intel, AMD and VIA CPUs", Knights Corner chapter).
#     Two instructions per cycle is this core's default issue width
#     (pim.pe.issue_width 2); for issue width 1 the same 16 B is used. zsim counts the instruction-cache reads at this
#     width (InOrderCore ifetchChunks, zsim key fetchBytesPerCycle); the
#     cache is still looked up, and its latency charged, once per line.
#     The in-order core models no wrong-path fetch (in_order_core.cpp
#     BranchFunc: "wrong-path fetches not modeled").
#   branch_predictor: pag. The value every in-order element takes when its
#     config does not set pim.pe.branch_predictor (device scope),
#     system.devices[].pim.pe.branch_predictor or system.hosts[].branch_predictor
#     (1.12.1, ticket #114). Only pag or none is accepted.
#       pag   the structures InOrderCore has always run: a 2-level PAg
#             direction predictor (BranchPredictorPAg<11, 18, 14>: 2048 x
#             18-bit local histories, 16384 2-bit counters) plus a 512-entry
#             direct-mapped BTB and a 16-entry return-address stack
#             (IndirectPredictor<9, 16>; in_order_core.h branchPred /
#             indirPred). Unchanged value: pag is today's machine.
#       none  no prediction structure. Fetch always continues at the
#             fall-through (static not-taken); nothing is predicted, read or
#             trained. A redirect pays the bubble of the stage that first
#             knows its target, with the two penalties above: a TAKEN
#             conditional branch, an indirect jmp/call or a return is known
#             at EXECUTE (mispredict_penalty_cycles); a direct call or jmp
#             has its target computed by the decoder (resteer_penalty_cycles);
#             a not-taken branch is free. McPAT prices no predictor
#             (prediction_width 0, no BTB, RAS or pattern table).
#     in_order + issue width 1 + none is the scalar single-issue in-order PE
#     that replaces the retired simple_core (1.12.1); McPAT prices it with one
#     ALU, one MUL and one FPU at the depth above (mispredict_penalty_cycles,
#     the refill the timing charges -- user ruling 2026-10-05; the retired
#     simple cell used 5).
#
# ooo
#   mispredict_penalty_cycles: 17. The TOTAL cost of a mispredict on the
#     out-of-order core, counted from the branch's resolution (1.12.0, ticket
#     #50, user ruling (b) 2026-10-05). The redirect is resolution-bound:
#     fetch restarts after the mispredicted branch uop COMPLETES (its
#     execute-complete cycle, zsim's lastCommitCycle -- not its ROB
#     retirement), placed so that the first correct-path uop dispatches no
#     earlier than resolution + this value. The stage model already charges a
#     9-cycle refill after any fetch restart (fetch->decode 3 +
#     issue->dispatch 6; decode->issue is not charged; ooo_core.cpp
#     REDIRECT_REFILL_CYCLES), so the restart is placed 17 - 9 = 8 cycles
#     after resolution. Through 1.11.x the restart was AT resolution, the cost
#     was the 9-cycle refill alone and this value only sized the wrong path.
#     A value below 9 is refused by the core at initialisation. The same
#     value still sets HOW FAR the wrong path is fetched (below). 17 is the
#     Westmere-class measured penalty (Nehalem/Westmere >= 17 cycles, A. Fog,
#     "The microarchitecture of Intel, AMD and VIA CPUs", Nehalem chapter),
#     the "typical branch mispred penalty of 17 cycles" the wrong-path
#     comment in ooo_core.cpp states for the Westmere-matched pipeline.
#   fetch_width_bytes: 16. BYTES per cycle, not instructions or lines: x86
#     instructions are variable-length and zsim fetches in 16-byte-wide
#     accesses (ooo_core.cpp FETCH_BYTES_PER_CYCLE 16, "The Nehalem frontend
#     fetches instructions in 16-byte-wide accesses").
#     PIMID (1.12.71), user ruling 2026-10-26 (1): on a processing element it is
#     also the bytes one instruction-cache read delivers (see
#     in_order.fetch_width_bytes); zsim counts the reads at this width
#     (OOOCore ifetchChunks, wrong-path lines included). Host cores keep the
#     full-line access.
#   wrong-path fetch depth (R2355 (b), not a field):
#     lines = ceil(mispredict_penalty_cycles x fetch_width_bytes / line size)
#           = ceil(17 x 16 / 64) = ceil(4.25) = 5 lines at 64 B.
#     Through 1.11.96 the depth was the literal 5*64/lineSize (5 lines at
#     64 B: a backpressured IQ + uop queue + IW bound). At the 64 B line every
#     shipped config uses, the computed depth equals the old one; at 32 B it is
#     9 (was 10), at 128 B it is 3 (was 2).
#   retire_width: 4. OOOCore retires through ReorderBuffer<128, 4> (the
#     second template argument is the retire width, ooo_core.h rob). It is a
#     compile-time constant of the timing core, so the record must equal it;
#     the loader refuses any other value. McPAT's commit_width reads this
#     field (was commit_width = issue_width).
#   (no resteer_penalty_cycles: OOOCore charges an indirect jmp/call or
#    return target miss the same resolution-bound redirect, total cost
#    mispredict_penalty_cycles -- fetchCycle = max(fetchCycle,
#    lastCommitCycle + mispredict_penalty_cycles - 9).)
#   TLB geometry (1.12.18:, user ruling: the published spec of
#     the core the timing model mirrors). zsim's OOOCore is matched to
#     Westmere (ooo_core.cpp:48 "more or less matched to Westmere"; Sanchez and
#     Kozyrakis, ISCA 2013, validated against a Westmere system), the 32 nm
#     version of Nehalem whose features "all ... also apply" (Intel 64 and
#     IA-32 Architectures Optimization Reference Manual, order 248966-031,
#     Sept 2015, sec. 2.5). Sec. 2.5.4 (Cache and Memory Subsystem):
#       ITLB: 64 entries per thread for 4 KB pages (128 per core, Table 2-13
#             "ITLB 4K page entries 128"; statically partitioned between two
#             threads only in HT operation, sec. 2.5.9) and 7 per thread for
#             large pages (replicated per thread, sec. 2.5.9);
#       DTLB0: 64 entries for 4 KB pages, 32 for large pages;
#       STLB: 512 entries, 4 KB pages, code and data;
#       "All entries are 4-way associative."
#     The core zsim runs is ONE hardware thread, so the large-page ITLB is
#     one thread's 7. McPAT (core.cc MemManU) builds ONE first-level ITLB and
#     ONE DTLB array per core, so each is priced as the 4 KB-page array plus
#     the large-page array (both physically present and both translate a
#     fetch/load whose page size is not known before the lookup); whether
#     the two are probed in parallel on every access is taken as
#     yes -- the combined array prices both arrays' leakage and area, which
#     the manual establishes. McPAT has no second-level TLB structure, so the
#     STLB is recorded and NOT priced (stated in the run). zsim models no TLB
#     (no misses), so the STLB would see no lookups; its leakage and area are
#     the omission. Used only for host cores: device elements address memory
#     physically (no TLB in the timing model; the AddressTranslator class in
#     src/address_translation has no caller) and keep McPAT's 1-entry floor.
#     The in_order core is PIMID's own scoreboard core, so for its TLB
#     an in-order host core keeps McPAT's 1-entry floor (accesses are still
#     its fetches and data accesses). power.models.tlb_published_geometry:
#     false restores the 1-entry floor on every core.
# ooo_host: the out-of-order window of a HOST core. The host stands for a recent server core, not the Westmere-class core
# the timing model was validated on. The values are those of Intel Golden Cove, the core of the
# 4th Gen Xeon Scalable (Sapphire Rapids) whose DDR5 host memory configuration (closed page policy, Lenovo Press LP1836) the
# host baselines already follow:
#   rob_entries 512            reorder buffer: 512 entries, up from Sunny Cove's 352 (Chips and Cheese, "Popping the Hood
#                              on Golden Cove"; WikiChip, Golden Cove).
#   load_queue_entries 192     Chips and Cheese measured 192 load queue entries on Sapphire Rapids (Intel's figure is 240).
#   store_queue_entries 114    114 store queue entries (WikiChip; Wikipedia, Golden Cove: 192 load / 114 store).
#   scheduler_entries 160      the instruction window the timing core schedules all micro-operation classes from. Intel
#                              does not publish Golden Cove's scheduler size; 160 is Sunny Cove's (WikiChip, Sunny Cove),
#                              which Golden Cove is stated to enlarge (Chips and Cheese: "a comparatively smaller boost").
#   l1d_fill_buffers 16        L1D fill buffers: 16, up from 12 (AnandTech, "Golden Cove Microarchitecture (P-Core)
#                              Examined"); a line request to the next level holds one until the line arrives.
#   store_buffer true          a store leaves the reorder buffer when it commits and its line is written to the L1D from
#                              the store queue afterwards, in program order (the x86 memory model). false holds the ROB entry
#                              until the line is written, as this model did before.
# The Westmere-class core this model began with is 128 / 32 / 32 / 36, no fill-buffer limit, store_buffer false: set those
# values to run it. A processing element's out-of-order core keeps that window, with the record's ooo.l1d_fill_buffers.
ooo_host:
  rob_entries: 512
  load_queue_entries: 192
  store_queue_entries: 114
  scheduler_entries: 160
  l1d_fill_buffers: 16
  store_buffer: true
# host_prefetch: the L2 hardware prefetchers of a HOST out-of-order core (a processing element has none). Intel 64 and
# IA-32 Architectures Optimization Reference Manual (248966-048), "Data Prefetch to the L2 and Last Level Cache", p. 2-17:
#   l2_streamer true          the streamer watches the L1D's requests to the L2 (loads and stores) for ascending and
#                             descending line sequences and prefetches the lines ahead into the L2 (and the LLC); the
#                             prefetched lines stay in the 4 KB page of the request that triggered them.
#   streams 32                "Detects and maintains up to 32 streams of data accesses. For each 4K byte page, ... one
#                             forward and one backward stream".
#   distance_lines 20         "The streamer can run up to 20 lines ahead of the load request."
#   prefetches_per_lookup 2   "The streamer may issue two prefetch requests on every L2 lookup."
#   spatial true              the spatial prefetcher "strives to complete every cache line fetched to the L2 cache with
#                             the pair line that completes it to a 128-byte aligned chunk".
#   superqueue_entries 48     an L2 miss (demand or prefetch) holds a superqueue entry until its line arrives; Golden
#                             Cove: 48, up from Sunny Cove's 32 ("only applies to the first miss for a cache line"; fill
#                             buffer and superqueue entries can also be occupied by prefetch requests -- Chips and Cheese,
#                             "Popping the Hood on Golden Cove"). A prefetch is not issued while every entry is held (the
#                             manual: with many outstanding requests the streamer prefetches less far ahead).
# The manual describes Golden Cove's prefetchers as "enhanced ... for increased memory parallelism" without figures; the
# values above are the streamer's published ones. A stream is detected by two requests to one page whose line offsets move
# in one direction. Not modelled: the L1D prefetchers (next-line, IP stride), code-fetch requests as streamer triggers,
# and prefetching to the LLC only (the manual gives no threshold for it). l2_streamer false: no prefetcher, as before.
host_prefetch:
  l2_streamer: true
  streams: 32
  distance_lines: 20
  prefetches_per_lookup: 2
  spatial: true
  superqueue_entries: 48
record: pimid core default
in_order:
  mispredict_penalty_cycles: 7
  resteer_penalty_cycles: 4
  retire_width: issue
  fetch_width_bytes: 16
  branch_predictor: pag
ooo:
  mispredict_penalty_cycles: 17
  fetch_width_bytes: 16
  retire_width: 4
  itlb_entries: 128          # 4 KB pages (248966-031 Table 2-13; sec. 2.5.4)
  itlb_large_entries: 7      # 2M/4M pages, per thread (sec. 2.5.4 / 2.5.9)
  dtlb_entries: 64           # DTLB0, 4 KB pages (sec. 2.5.4)
  dtlb_large_entries: 32     # DTLB0, large pages (sec. 2.5.4)
  tlb_associativity: 4       # "All entries are 4-way associative" (sec. 2.5.4)
  stlb_entries: 512          # second level, 4 KB pages (sec. 2.5.4); priced (1.12.129): leakage and area, no lookup counted
  l1d_fill_buffers: 10       # L1D line fill buffers of the Nehalem / Westmere core: 10 (Intel 64 and IA-32 Architectures
                             # Optimization Reference Manual, 248966-025, June 2011, Table 2-7 "L1 Data Cache Components":
                             # line fill buffers 10 entries; sec. 2.3.5: "48 load buffers, 32 store buffers and 10 fill
                             # buffers"). A processing element's out-of-order core: a line request to the next level holds
                             # one until the line arrives (the host core's are ooo_host.l1d_fill_buffers).
